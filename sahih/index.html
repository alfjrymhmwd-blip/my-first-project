<title>موسوعة الصحيحين</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رفيق الحفظ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a library — sticky ink header, a reading column of book shelves and hadith folios, a fixed tab bar. */
  :root {
    --paper: #f3f2ee;
    --surface: #ffffff;
    --surface-2: #e9e8e2;
    --ink: #1a2230;
    --muted: #5f6878;
    --line: #dcdbd3;
    --navy: #1d3557;
    --navy-soft: #dfe6f0;
    --on-navy: #ffffff;
    --gold: #9a6a12;
    --gold-soft: #f3e6c6;
    --sea: #0e6e6a;
    --sea-soft: #d9eeec;
    --rose: #8a3a55;
    --rose-soft: #f4e1e8;
    --font-text: "Amiri", "Traditional Arabic", serif;
    --font-ui: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
    --font-display: "Reem Kufi", "Noto Kufi Arabic", sans-serif;
    --matn-size: 1.45rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e121a; --surface: #161c27; --surface-2: #1e2532; --ink: #e6eaf1; --muted: #98a2b3;
      --line: #2a3242; --navy: #8fb3e6; --navy-soft: #1c2a40; --on-navy: #0b111b;
      --gold: #e0b75e; --gold-soft: #3a2f18; --sea: #5fc7bf; --sea-soft: #15302e; --rose: #e095b0; --rose-soft: #3a2230;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e121a; --surface: #161c27; --surface-2: #1e2532; --ink: #e6eaf1; --muted: #98a2b3;
    --line: #2a3242; --navy: #8fb3e6; --navy-soft: #1c2a40; --on-navy: #0b111b;
    --gold: #e0b75e; --gold-soft: #3a2f18; --sea: #5fc7bf; --sea-soft: #15302e; --rose: #e095b0; --rose-soft: #3a2230;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.7;
    padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  a { color: var(--navy); }

  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--on-navy);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .head-in { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .head-in h1 { font-family: var(--font-display); font-size: 21px; margin: 0; flex: 1; line-height: 1.3; }
  .head-in h1 small { display: block; font-family: var(--font-ui); font-size: 11px; font-weight: 400; opacity: .8; }
  .appswitch { display: inline-flex; background: color-mix(in srgb, var(--on-navy) 16%, transparent); border-radius: 999px; padding: 3px; gap: 2px; }
  .appswitch a { color: inherit; text-decoration: none; font-size: 13px; padding: 3px 12px; border-radius: 999px; opacity: .85; white-space: nowrap; }
  .appswitch a.on { background: var(--on-navy); color: var(--navy); opacity: 1; font-weight: 700; }
  .hbtn { background: transparent; border: 1px solid color-mix(in srgb, var(--on-navy) 40%, transparent); color: var(--on-navy); border-radius: 10px; padding: 3px 10px; font-size: 13px; }

  main {
    max-width: 780px; margin: 0 auto; padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }
  h2 { font-family: var(--font-display); font-size: 20px; margin: 0; text-wrap: balance; line-height: 1.4; }
  h3 { font-size: 14px; margin: 0 0 6px; color: var(--navy); }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .crumbs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .crumbs a { text-decoration: none; color: var(--navy); }

  .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 7px 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); font-weight: 600; }
  .btn.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .badge { display: inline-flex; font-size: 12px; font-weight: 600; padding: 1px 10px; border-radius: 999px; white-space: nowrap; }
  .b-b { background: var(--sea-soft); color: var(--sea); }
  .b-m { background: var(--rose-soft); color: var(--rose); }
  .b-g { background: var(--gold-soft); color: var(--gold); }

  /* Collections */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .col { text-align: right; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
  .col::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c); }
  .col.b { --c: var(--sea); } .col.m { --c: var(--rose); }
  .col .t { font-family: var(--font-display); font-size: 22px; }
  .col .a { font-size: 12.5px; color: var(--muted); }
  .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--c, var(--navy)); border-radius: 99px; }

  /* Books */
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .book { text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; }
  .book:hover, .item:hover, .col:hover { border-color: var(--navy); }
  .book .no { font-family: var(--font-display); color: var(--gold); text-align: center; font-variant-numeric: tabular-nums; }
  .book .nm { font-weight: 600; min-width: 0; }
  .book .rg { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }

  /* Hadith list */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: grid; grid-template-columns: 52px 1fr; gap: 10px; }
  .item .no { font-family: var(--font-display); color: var(--gold); font-size: 15px; text-align: center; font-variant-numeric: tabular-nums; padding-top: 3px; }
  .item .no.read { color: var(--sea); }
  .item .tx { font-family: var(--font-text); font-size: 1.12rem; line-height: 1.9; min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { grid-column: 2; font-size: 12px; color: var(--muted); margin-top: -4px; }

  /* Folio */
  .folio { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; position: relative; display: flex; flex-direction: column; gap: 10px; }
  .folio::before { content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius: 13px; pointer-events: none; }
  .folio > * { position: relative; }
  .num { font-family: var(--font-display); color: var(--gold); font-variant-numeric: tabular-nums; }
  .matn { font-family: var(--font-text); font-size: var(--matn-size); line-height: 2.1; text-align: justify; }
  .matn .q { color: var(--navy); font-weight: 700; }
  .sizer { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .sizer button { background: var(--surface-2); border: 0; padding: 2px 10px; }

  .sharh { gap: 12px; }
  .sharh .blk { border-top: 1px solid var(--line); padding-top: 10px; }
  .sharh .blk:first-of-type { border-top: 0; padding-top: 0; }
  .sharh ul { margin: 0; padding: 0 20px 0 0; display: flex; flex-direction: column; gap: 4px; }
  dl.words { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  dl.words dt { font-family: var(--font-text); font-weight: 700; font-size: 1.12rem; color: var(--rose); }
  dl.words dd { margin: 0; }
  .apply { background: var(--gold-soft); border-radius: 12px; padding: 10px 14px; }
  .apply h3 { color: var(--gold); }
  .note { font-size: 12px; color: var(--muted); border-inline-start: 3px solid var(--gold); padding-inline-start: 10px; }
  .thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .dots::after { content: "…"; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0 } to { width: 1.2em } }

  .search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 13px; }
  .seg button.on { background: var(--navy); color: var(--on-navy); }
  mark { background: var(--gold-soft); color: inherit; border-radius: 4px; padding: 0 2px; }
  .empty { text-align: center; padding: 26px 10px; color: var(--muted); }

  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .lv { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 4px; font-size: 13px; }
  .lv.on { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .w { border-radius: 6px; transition: background .2s, color .2s; }
  .w.hid { color: transparent; background: var(--surface-2); cursor: pointer; box-shadow: inset 0 -2px 0 var(--line); }
  .w.rev { background: var(--gold-soft); }
  .btn.done { background: var(--sea-soft); border-color: var(--sea); color: var(--sea); font-weight: 600; }
  .steps { margin: 0; padding: 0 20px 0 0; color: var(--muted); font-size: 13.5px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; }
  .opt.txt { font-family: var(--font-text); font-size: 1.15rem; line-height: 1.9; }
  .opt.right { border-color: var(--sea); background: var(--sea-soft); color: var(--sea); }
  .opt.wrong { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); }
  .opt:disabled { cursor: default; }
  .score { font-family: var(--font-display); font-size: 46px; color: var(--navy); text-align: center; line-height: 1.2; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-family: var(--font-display); font-size: 24px; color: var(--navy); line-height: 1.3; }
  .stats span { font-size: 12px; color: var(--muted); }
  @media (max-width: 420px) { .levels { grid-template-columns: repeat(2, 1fr); } .tab { font-size: 11px; } }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tab { background: transparent; border: 0; border-radius: 12px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--muted); }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: var(--navy); background: var(--navy-soft); font-weight: 700; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 420px) { :root { --matn-size: 1.3rem; } .head-in h1 small { display: none; } .head-in h1 { font-size: 17px; } .appswitch a { padding: 3px 9px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div dir="rtl" lang="ar">
<header>
  <div class="head-in">
    <h1>موسوعة الصحيحين<small>كل أحاديث صحيح البخاري وصحيح مسلم مع الشرح</small></h1>
    <nav class="appswitch" id="appSwitch" aria-label="التبديل بين القرآن والأحاديث" hidden><a href="../index.html">القرآن</a><a class="on" href="./" aria-current="page">الأحاديث</a></nav>
    <button class="hbtn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">الوضع</button>
  </div>
</header>
<main id="app"><div class="panel"><p class="muted">جارٍ تحميل فهرس الكتابين…</p></div></main>
<nav class="tabs" aria-label="التنقل">
  <div class="tabs-in">
    <button class="tab" data-go="home" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>الرئيسية</button>
    <button class="tab" data-go="c-b" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>البخاري</button>
    <button class="tab" data-go="c-m" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>مسلم</button>
    <button class="tab" data-go="hifz" type="button"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1v14c3-1 6-.5 8 1 2-1.5 5-2 8-1V5c-3-1-6-.5-8 1z"/><path d="M12 6v14"/></svg>الحفظ</button>
    <button class="tab" data-go="search" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>البحث</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ---------- الأساسيات ---------- */
const COL = { b: { name: "صحيح البخاري", short: "البخاري", author: "الإمام محمد بن إسماعيل البخاري (ت 256هـ)", cls: "b-b" },
              m: { name: "صحيح مسلم", short: "مسلم", author: "الإمام مسلم بن الحجاج النيسابوري (ت 261هـ)", cls: "b-m" } };
const app = document.getElementById("app");
const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const strip = (t) => t.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
const KEY = "sahihain-v1";
let S = { read: {}, fav: {}, memo: {}, last: null, size: 0, best: 0, quizzes: 0 };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

let INDEX = null, CURATED = {};
const BOOKS = {};               // "b8" -> rows [[key, displayNo, text]]
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
async function loadBook(c, id) { const k = c + id; if (!BOOKS[k]) BOOKS[k] = await getJSON(`data/${k}.json`); return BOOKS[k]; }
const bookMeta = (c, id) => INDEX[c].books.find((b) => b.id === +id);
const hkey = (c, id, key) => `h-${c}-${id}-${key}`;
const dispNo = (c, row) => row[1] ? ar(row[1]) : (c === "m" ? "—" : ar(row[0]));
const refText = (c, row) => `${COL[c].name}${row[1] ? "، رقم " + ar(row[1]) : ""}`;
const readCount = (c, id) => Object.keys(S.read).filter((k) => k.startsWith(c + id + ":")).length;

// كلام النبي ﷺ يرد غالبًا بين علامتي تنصيص
function matnHTML(t) { if ((t.match(/"/g) || []).length % 2) t += '"'; return esc(t).replace(/&quot;([^&]+?)&quot;/g, '<span class="q">"$1"</span>'); }
function quoted(t) { if ((t.match(/"/g) || []).length % 2) t += '"'; const all = [...t.matchAll(/"([^"]+)"/g)].map((m) => m[1].trim()); return all.sort((a, b) => b.length - a.length)[0] || ""; }
function snippet(t) { const q = quoted(t); if (q.split(" ").length >= 4) return q; const w = t.split(" "); return w.slice(Math.max(0, w.length - 28)).join(" "); }
function dorarURL(t) { const base = snippet(t); return "https://dorar.net/hadith/search?q=" + encodeURIComponent(strip(base).replace(/[^ء-ي ]/g, " ").split(/\s+/).filter(Boolean).slice(0, 8).join(" ")); }

/* ---------- الشرح عبر Claude ---------- */
let sample = null;
(async () => { try { sample = window.claude ? await window.claude.use("sample") : null; } catch (e) { sample = null; } if (INDEX && location.hash.startsWith("#h-")) route(); })();

/* ---------- الشاشات ---------- */
async function viewHome() {
  let today = "";
  const ck = Object.keys(CURATED);
  if (ck.length) {
    const k = ck[Math.floor(Date.now() / 86400000) % ck.length];
    const [c, key] = k.split(":");
    const loc = await findCurated(c, key);
    if (loc) {
      const cur = CURATED[k];
      today = `<section class="folio">
        <div class="row"><span class="badge b-g">حديث اليوم</span><span class="spacer"></span><span class="badge ${COL[c].cls}">${COL[c].short} ${dispNo(c, loc.row)}</span></div>
        <h2>${esc(cur.ttl)}</h2>
        <p class="matn">${matnHTML(snippet(loc.row[2]))}</p>
        <div class="row"><span class="muted small">${esc(bookMeta(c, loc.id).name)}</span><span class="spacer"></span><a class="btn primary" href="#${hkey(c, loc.id, key)}">اقرأ الحديث وشرحه</a></div>
      </section>`;
    }
  }
  const last = S.last ? (() => { const [c, id, key] = S.last; return `<a class="btn" href="#${hkey(c, id, key)}">تابع القراءة: ${COL[c].short}، ${esc(bookMeta(c, id).name)}</a>`; })() : "";
  const nFav = Object.keys(S.fav).length;
  return `${today}
  <section class="cols">${["b", "m"].map((c) => {
    const read = Object.keys(S.read).filter((k) => k[0] === c).length;
    return `<a class="col ${c}" href="#c-${c}"><span class="t">${COL[c].name}</span>
      <span class="a">${COL[c].author}</span>
      <span>${INDEX[c].count.toLocaleString("ar-EG")} حديثًا في ${ar(INDEX[c].books.length)} كتابًا</span>
      <div class="bar"><i style="width:${(read / INDEX[c].count) * 100}%"></i></div>
      <span class="a">قرأت ${ar(read)} حديثًا</span></a>`;
  }).join("")}</section>
  <div class="row">${last}${nFav ? `<a class="btn" href="#fav">المفضلة (${ar(nFav)})</a>` : ""}<a class="btn" href="#search">ابحث في كل الأحاديث</a></div>
  <section class="panel small">
    <h3>كيف تستفيد من الموسوعة؟</h3>

let Q = null;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
async function quizPool() {
  const pool = [], seen = {};
  for (const [c, id, key] of Object.values(S.memo)) { const row = (await loadBook(c, id)).find((r) => r[0] === key); if (row) { pool.push({ c, id, row }); seen[c + ":" + key] = 1; } }
  for (const k of Object.keys(CURATED)) { if (seen[k]) continue; const [c, key] = k.split(":"); const loc = await findCurated(c, key); if (loc) pool.push({ c, id: loc.id, row: loc.row }); }
  return pool;
}
function halves(t) { const w = memoText(t).split(/\s+/); const cut = Math.ceil(w.length / 2); return [w.slice(0, cut).join(" "), w.slice(cut).join(" ")]; }
function makeQ(item, pool) {
  const { c, id, row } = item; const [a, b2] = halves(row[2]);
  const type = b2.split(" ").length >= 3 && Math.random() < 0.65 ? "complete" : "book";
  if (type === "complete") {
    const others = shuffle(pool.filter((p) => p !== item)).map((p) => halves(p.row[2])[1]).filter((x) => x && x !== b2).slice(0, 3);
    return { item, label: "أكمل الحديث", prompt: a + " …", opts: shuffle([b2, ...others]), ans: b2, txt: true };
  }
  const text = memoText(row[2]);
  {
    const name = "كتاب " + bookMeta(c, id).name;
    const others = shuffle(INDEX[c].books.filter((b) => b.id !== +id)).slice(0, 3).map((b) => "كتاب " + b.name);
    return { item, label: `في أي كتاب من ${COL[c].name} ورد هذا الحديث؟`, prompt: text, opts: shuffle([name, ...others]), ans: name };
  }
  return null;
}
async function viewQuiz() {
  if (!Q) return `<h2>اختبر نفسك</h2><section class="panel"><p>عشرة أسئلة من محفوظاتك ومن الأحاديث المشهورة: أكمل الحديث، وفي أي كتاب ورد.</p>
    <div class="row"><button class="btn primary" data-act="quizStart" type="button">ابدأ الاختبار</button><a class="btn" href="#hifz">رجوع</a></div></section>`;
  if (Q.i >= Q.items.length) {
    const wrong = Q.items.filter((q) => !q.ok);
    return `<section class="panel" style="text-align:center"><div class="score">${ar(Q.score)} / ${ar(Q.items.length)}</div>
      <p>${Q.score === Q.items.length ? "ممتاز! بارك الله فيك." : Q.score >= 7 ? "أحسنت، استمر في المراجعة." : "راجع الأحاديث التي أخطأت فيها ثم أعد المحاولة."}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="quizStart" type="button">اختبار جديد</button><a class="btn" href="#hifz">الحفظ</a></div></section>
    ${wrong.length ? `<h2>راجع هذه الأحاديث</h2><div class="list">${wrong.map((q) => { const { c, id, row } = q.item; return `<a class="item" href="#${"m" + hkey(c, id, row[0]).slice(1)}"><span class="no">${dispNo(c, row)}</span><span class="tx">${esc(memoText(row[2]))}</span></a>`; }).join("")}</div>` : ""}`;
  }
  const q = Q.items[Q.i], done = Q.picked !== null;
  return `<div class="row"><span class="muted small">السؤال ${ar(Q.i + 1)} من ${ar(Q.items.length)}</span><span class="spacer"></span><span class="muted small">النتيجة: ${ar(Q.score)}</span></div>
  <div class="bar"><i style="width:${(Q.i / Q.items.length) * 100}%"></i></div>
  <section class="folio"><span class="badge b-g" style="align-self:flex-start">${esc(q.label)}</span><p class="matn">${esc(q.prompt)}</p></section>
  <div class="opts">${q.opts.map((o, i) => `<button class="opt ${q.txt ? "txt" : ""} ${done ? (o === q.ans ? "right" : i === Q.picked ? "wrong" : "") : ""}" data-opt="${i}" type="button" ${done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
  ${done ? `<div class="row"><a class="btn" href="#${hkey(q.item.c, q.item.id, q.item.row[0])}">اقرأ الحديث</a><span class="spacer"></span><button class="btn primary" data-act="quizNext" type="button">${Q.i + 1 < Q.items.length ? "السؤال التالي" : "النتيجة"}</button></div>` : ""}`;
}

/* ---------- المفضلة ---------- */
async function viewFav() {
  const keys = Object.keys(S.fav);
  if (!keys.length) return `<h2>المفضلة</h2><div class="empty">لم تضف أحاديث بعد. اضغط «☆ مفضلة» في صفحة أي حديث.</div>`;
  const items = [];
  for (const k of keys) { const [c, id, key] = S.fav[k]; const row = (await loadBook(c, id)).find((r) => r[0] === key); if (row) items.push([c, id, row]); }
  return `<h2>المفضلة</h2><div class="list">${items.map(([c, id, r]) => `<a class="item" href="#${hkey(c, id, r[0])}"><span class="no"><span class="badge ${COL[c].cls}">${COL[c].short}</span></span><span class="tx">${esc(snippet(r[2]))}</span><span class="meta">${esc(refText(c, r))}</span></a>`).join("")}</div>`;
}

/* ---------- القراءة دون إنترنت ---------- */
const canOffline = "serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname);
function offlineBox() {
  if (!canOffline) return "";
  return `<section class="panel small"><h3>القراءة دون إنترنت</h3><p>الكتب التي تفتحها تُحفظ تلقائيًا. ولحفظ الصحيحين كاملين (قرابة ١٧ ميغابايت) اضغط:</p>
    <div class="row"><button class="btn" data-act="offline" type="button">حفظ كل الأحاديث على جهازي</button><span class="muted" id="offMsg"></span></div></section>`;
}
async function saveAll() {
  const msg = document.getElementById("offMsg"); const all = [];
  for (const c of ["b", "m"]) for (const b of INDEX[c].books) all.push(`data/${c}${b.id}.json`);
  let n = 0;
  for (const u of all) { try { await fetch(u); } catch (e) {} n++; if (msg) msg.textContent = `${ar(Math.round((n / all.length) * 100))}٪`; }
  if (msg) msg.textContent = "تم الحفظ ✓";
}

/* ---------- لمعرفة موضع الأحاديث المشروحة ---------- */
async function findCurated(c, key) {
  for (const b of INDEX[c].books) { if (c === "b" && (parseFloat(key) < parseFloat(b.k0) || parseFloat(key) > parseFloat(b.k1))) continue;
    const rows = await loadBook(c, b.id); const row = rows.find((r) => r[0] === key); if (row) return { id: b.id, row }; }
  return null;
}

/* ---------- التوجيه ---------- */
let seq = 0;
async function route() {
  const h = location.hash.slice(1) || "home", my = ++seq; let tab = "home", m, html;
  try {
    if ((m = h.match(/^c-(b|m)$/))) { tab = "c-" + m[1]; html = viewCollection(m[1]); }
    else if ((m = h.match(/^k-(b|m)-(\d+)$/))) { tab = "c-" + m[1]; html = await viewBook(m[1], +m[2]); }
    else if ((m = h.match(/^h-(b|m)-(\d+)-(.+)$/))) { tab = "c-" + m[1]; html = await viewHadith(m[1], +m[2], m[3]); }
    else if (h === "search") { tab = "search"; html = viewSearch(); }
    else if (h === "fav") { html = await viewFav(); }
    else if ((m = h.match(/^m-(b|m)-(\d+)-(.+)$/))) { tab = "hifz"; html = await viewMemorize(m[1], +m[2], m[3]); }
    else if (h === "hifz") { tab = "hifz"; html = await viewHifz(); }
    else if (h === "quiz") { tab = "hifz"; html = await viewQuiz(); }
    else html = await viewHome();
  } catch (e) { html = `<div class="panel"><p>تعذّر تحميل البيانات. تحقق من الاتصال ثم حدّث الصفحة.</p><p class="muted small">${esc(e.message || e)}</p></div>`; }
  if (my !== seq) return;
  app.innerHTML = html;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.go === tab));
  if (tab === "search") { const q = document.getElementById("q"); if (sq.q) runSearch(); else q.focus(); }
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }

let toastT;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); }
function applySize() { document.documentElement.style.setProperty("--matn-size", S.size ? `${1.45 + S.size * 0.15}rem` : ""); }

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-go],[data-more],[data-act],[data-scope],[data-size],[data-level],[data-w],[data-opt]"); if (!el) return;
  const d = el.dataset;
  if (d.go) { if (d.go === "hifz" && Q && Q.i >= Q.items.length) Q = null; go(d.go); window.scrollTo(0, 0); return; }
  if (d.more) { listLimit[d.more] = (listLimit[d.more] || PAGE) + PAGE * 2; const y = scrollY; await route(); scrollTo(0, y); return; }
  if (d.scope) { sq.c = d.scope; sq.lim = 30; document.querySelectorAll("[data-scope]").forEach((b) => b.classList.toggle("on", b === el)); runSearch(); return; }
  if (d.level) { hifzLevel = +d.level; route(); return; }
  if (d.w !== undefined) { if (el.classList.contains("hid")) { el.classList.remove("hid"); el.classList.add("rev"); } return; }
  if (d.opt !== undefined) { if (!Q || Q.picked !== null) return; const q = Q.items[Q.i]; Q.picked = +d.opt; q.ok = q.opts[Q.picked] === q.ans; if (q.ok) Q.score++; route(); return; }
  if (d.size) { S.size = Math.max(-2, Math.min(4, (S.size || 0) + +d.size)); save(); applySize(); return; }
  switch (d.act) {
    case "explain": if (sample) explain(); break;
    case "stop": explainCtl && explainCtl.abort(); break;
    case "fav": { const [c, id, key] = S.last; const k = c + ":" + key; if (S.fav[k]) delete S.fav[k]; else S.fav[k] = [c, id, key]; save();
      el.classList.toggle("on", !!S.fav[k]); el.textContent = S.fav[k] ? "★ في المفضلة" : "☆ مفضلة"; toast(S.fav[k] ? "أُضيف إلى المفضلة" : "أُزيل من المفضلة"); break; }
    case "copy": { const [c, id, key] = S.last; const row = (await loadBook(c, id)).find((r) => r[0] === key);
      const txt = `${row[2]}\n— ${refText(c, row)}، كتاب ${bookMeta(c, id).name}`;
      const ok = () => toast("نُسخ الحديث");
      try { await navigator.clipboard.writeText(txt); ok(); } catch (err) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (x) { toast("تعذّر النسخ"); } ta.remove(); }
      break; }
    case "moreResults": sq.lim += 30; runSearch(); break;
    case "offline": el.disabled = true; saveAll(); break;
    case "reveal": document.querySelectorAll("#memoText .w.hid").forEach((w) => { w.classList.remove("hid"); w.classList.add("rev"); }); break;
    case "rehide": route(); break;
    case "memo": { const [c, id, key] = S.last; const k = c + ":" + key; if (S.memo[k]) delete S.memo[k]; else S.memo[k] = [c, id, key]; save();
      toast(S.memo[k] ? "بارك الله فيك! أُضيف إلى محفوظاتك" : "أُزيل من المحفوظات"); route(); break; }
    case "quizStart": { el.disabled = true; el.textContent = "جارٍ التحضير…"; const pool = await quizPool();
      Q = { items: shuffle(pool).slice(0, 10).map((it) => makeQ(it, pool)), i: 0, score: 0, picked: null }; route(); break; }
    case "quizNext": Q.i++; Q.picked = null; if (Q.i >= Q.items.length) { S.quizzes++; S.best = Math.max(S.best, Q.score); save(); } route(); scrollTo(0, 0); break;
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "q") { sq.q = e.target.value; sq.lim = 30; clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 450); } });

/* ---------- الوضع الليلي والتشغيل ---------- */
const root = document.documentElement; root.lang = "ar"; root.dir = "rtl";
try { const t = localStorage.getItem(KEY + "-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem(KEY + "-theme", root.dataset.theme); } catch (e) {}
});
applySize();
// داخل مشروع «رفيق الحفظ»: زر التبديل إلى القرآن وعامل العمل دون إنترنت المشترك
fetch("../index.html", { method: "HEAD", cache: "no-store" }).then((r) => {
  if (!r.ok) return;
  document.getElementById("appSwitch").hidden = false;
  if (!canOffline) return;
  navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((x) => { if (/\/sahih\/$/.test(x.scope)) x.unregister(); })).catch(() => {});
  navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});
}).catch(() => {});
(async () => {
  try { INDEX = await getJSON("data/index.json"); } catch (e) { app.innerHTML = `<div class="panel"><p>تعذّر تحميل فهرس الكتابين. تحقق من الاتصال ثم حدّث الصفحة.</p></div>`; return; }
  try { CURATED = await getJSON("data/curated.json"); } catch (e) { CURATED = {}; }
  route();
})();
</script>
