<title>رياض الصحيحين</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d5c55">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one reading column; a sticky ink-teal header, the hadith set like a manuscript page, a fixed tab bar at the bottom. */
  :root {
    --paper: #f4f3ec;
    --surface: #ffffff;
    --surface-2: #eceae0;
    --ink: #1b2422;
    --muted: #63706b;
    --line: #dfdcd0;
    --teal: #0d5c55;
    --teal-soft: #dcebe7;
    --on-teal: #ffffff;
    --gold: #9a6e14;
    --gold-soft: #f4e8c8;
    --plum: #7a3b5e;
    --plum-soft: #f3e2eb;
    --ok: #1f7a4a;
    --ok-soft: #dcf0e3;
    --bad: #a3352b;
    --bad-soft: #f7e0dc;
    --font-text: "Amiri", "Traditional Arabic", serif;
    --font-ui: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
    --font-display: "Reem Kufi", "Noto Kufi Arabic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f1514; --surface: #172120; --surface-2: #1e2a28; --ink: #e8eeeb; --muted: #93a19c;
      --line: #2a3633; --teal: #5cc2b4; --teal-soft: #173431; --on-teal: #0b1514;
      --gold: #ddb55a; --gold-soft: #3a3018; --plum: #d892b8; --plum-soft: #3a2232;
      --ok: #5fd08f; --ok-soft: #173a26; --bad: #ef8a7e; --bad-soft: #3d1f1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1514; --surface: #172120; --surface-2: #1e2a28; --ink: #e8eeeb; --muted: #93a19c;
    --line: #2a3633; --teal: #5cc2b4; --teal-soft: #173431; --on-teal: #0b1514;
    --gold: #ddb55a; --gold-soft: #3a3018; --plum: #d892b8; --plum-soft: #3a2232;
    --ok: #5fd08f; --ok-soft: #173a26; --bad: #ef8a7e; --bad-soft: #3d1f1b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--font-ui); font-size: 15px; line-height: 1.7;
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--teal); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  a { color: var(--teal); }

  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--teal); color: var(--on-teal);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .head-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .head-in h1 { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 0; flex: 1; letter-spacing: 0; }
  .head-in h1 small { font-family: var(--font-ui); font-weight: 400; font-size: 11px; opacity: .8; display: block; line-height: 1.2; }
  .icon-btn { background: transparent; border: 1px solid color-mix(in srgb, var(--on-teal) 35%, transparent); color: var(--on-teal); border-radius: 10px; padding: 4px 10px; font-size: 13px; text-decoration: none; }

  main {
    max-width: 760px; margin: 0 auto;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0; text-wrap: balance; }
  h3 { font-size: 14px; font-weight: 700; margin: 0 0 6px; color: var(--teal); }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }

  /* Hadith "page" */
  .folio {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 18px 16px; position: relative;
    box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px color-mix(in srgb, var(--teal) 45%, transparent);
  }
  .folio::before {
    content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
    border-radius: 13px; pointer-events: none;
  }
  .folio-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
  .num { font-family: var(--font-display); color: var(--gold); font-size: 15px; font-variant-numeric: tabular-nums; }
  .matn {
    font-family: var(--font-text); font-size: 1.55rem; line-height: 2.15; margin: 12px 0 10px;
    position: relative; text-align: justify;
  }
  .matn .q { color: var(--teal); }
  .rawi { font-size: 13px; color: var(--muted); position: relative; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .b-q { background: var(--gold-soft); color: var(--gold); }
  .b-k { background: var(--teal-soft); color: var(--teal); }
  .b-m { background: var(--plum-soft); color: var(--plum); }
  .b-done { background: var(--ok-soft); color: var(--ok); }
  .b-cat { background: var(--surface-2); color: var(--muted); }

  .btn {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px;
    padding: 8px 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
  }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--on-teal); font-weight: 600; }
  .btn.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .btn.star.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .btn:disabled { opacity: .45; cursor: default; }

  .sec { display: flex; flex-direction: column; gap: 12px; }
  .sec-block { border-top: 1px solid var(--line); padding-top: 12px; }
  .sec-block:first-child { border-top: 0; padding-top: 0; }
  .sec-block p { margin: 0; }
  ul.fawaid { margin: 0; padding: 0 20px 0 0; display: flex; flex-direction: column; gap: 4px; }
  dl.words { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  dl.words dt { font-family: var(--font-text); font-size: 1.15rem; font-weight: 700; color: var(--plum); }
  dl.words dd { margin: 0; }
  .verify { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); border-color: var(--teal); background: var(--teal-soft); padding: 12px 16px; }
  .verify-t { font-weight: 700; color: var(--teal); }
  .amal { background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; }
  .amal h3 { color: var(--gold); }

  /* Home */
  .hero-today .eyebrow { font-size: 12px; letter-spacing: .5px; color: var(--gold); font-weight: 700; }
  .progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; transition: width .4s; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { text-align: center; }
  .stat b { display: block; font-family: var(--font-display); font-size: 26px; color: var(--teal); font-variant-numeric: tabular-nums; line-height: 1.3; }
  .stat span { font-size: 12px; color: var(--muted); }

  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .cat {
    text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .cat:hover { border-color: var(--teal); }
  .cat .t { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
  .cat .d { font-size: 12px; color: var(--muted); }

  /* List */
  .search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
  .chip.on { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start;
  }
  .item:hover { border-color: var(--teal); }
  .item .n { font-family: var(--font-display); color: var(--gold); font-size: 15px; text-align: center; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .item .n.done { color: var(--ok); }
  .item .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .item .ttl { font-weight: 700; }
  .item .ex { font-family: var(--font-text); font-size: 1.05rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; padding: 28px 10px; color: var(--muted); }

  /* Memorize */
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .levels .chip { white-space: normal; text-align: center; border-radius: 10px; padding: 6px 4px; }
  .w { cursor: default; border-radius: 6px; transition: background .2s, color .2s; }
  .w.hid { color: transparent; background: var(--surface-2); cursor: pointer; box-shadow: inset 0 -2px 0 var(--line); }
  .w.rev { background: var(--gold-soft); }
  .steps { margin: 0; padding: 0 20px 0 0; font-size: 13.5px; color: var(--muted); }

  /* Quiz */
  .qtype { font-size: 12px; color: var(--gold); font-weight: 700; }
  .qprompt { font-family: var(--font-text); font-size: 1.35rem; line-height: 2; margin: 6px 0 0; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
  .opt.txt { font-family: var(--font-text); font-size: 1.15rem; line-height: 1.9; }
  .opt:hover:not(:disabled) { border-color: var(--teal); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .opt:disabled { cursor: default; }
  .score-big { font-family: var(--font-display); font-size: 48px; color: var(--teal); text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums; }

  /* Bottom tabs */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-top: 6px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(8px, env(safe-area-inset-left, 0px));
    padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .tab { background: transparent; border: 0; border-radius: 12px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; color: var(--muted); }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: var(--teal); font-weight: 700; background: var(--teal-soft); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 40;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 420px) {
    .matn { font-size: 1.38rem; }
    .levels { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <div class="head-in">

    <a class="icon-btn" id="quranLink" href="index.html" hidden>رفيق الحفظ</a>

<script>
/* ---------- البيانات ---------- */
// src: q = متفق عليه، k = البخاري، m = مسلم
const CATS = [
  { id: "iman",   t: "الإخلاص والإيمان",  d: "أصول الدين وصلاح القلب" },
  { id: "ibada",  t: "الصلاة والعبادات",  d: "الطهارة والصلاة والصيام والحج" },
  { id: "ilm",    t: "القرآن والعلم",      d: "فضل التعلّم والتعليم" },
  { id: "khuluq", t: "الأخلاق",           d: "الصدق والحلم والرفق والحياء" },
  { id: "nas",    t: "الأسرة والمجتمع",    d: "الوالدان والجار والأخوّة" },
  { id: "dhikr",  t: "الذكر والدعاء",      d: "كلمات خفيفة أجرها عظيم" },
  { id: "qalb",   t: "القلب والدنيا",      d: "الزهد والصبر والصدقة" },
];

const H = [
// ===== الإخلاص والإيمان =====
{ c:"iman", src:"q", ref:"البخاري (1) ومسلم (1907)", n:"عمر بن الخطاب", ttl:"النية أساس العمل",
  text:"«إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله، ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها فهجرته إلى ما هاجر إليه»",
  sharh:"قيمة أي عمل عند الله بحسب نيّة صاحبه. عملان متشابهان في الظاهر قد يختلف أجرهما تمامًا لاختلاف القصد في القلب.",
  f:["الإخلاص شرط لقبول العمل.","العادات كالأكل والنوم تصير عبادة بالنية الصالحة.","الله يعلم ما في القلوب ولا يخفى عليه شيء."],
  w:[["امرئ","إنسان"],["هجرته","انتقاله من بلد الكفر إلى بلد الإسلام"],["ينكحها","يتزوجها"]],
  amal:"قبل أن تبدأ دراستك أو عملك اليوم، قل في نفسك: أفعل هذا لأرضي الله وأنفع الناس." },
{ c:"iman", src:"q", ref:"البخاري (8) ومسلم (16)", n:"عبد الله بن عمر", ttl:"أركان الإسلام الخمسة",
  text:"«بُني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان»",
  sharh:"شبّه النبي ﷺ الإسلام ببناء له خمسة أعمدة، إذا سقط عمود منها اختلّ البناء كله.",
  f:["الشهادتان هما الأساس الأول.","الصلاة أعظم العبادات العملية بعد الشهادتين.","التعليم بالأرقام والتقسيم يسهّل الحفظ."],
  w:[["بُني","أُسِّس وقام"],["إقام الصلاة","أداؤها كاملة في وقتها"],["إيتاء","إعطاء"]],
  amal:"راجع أي ركن تقصّر فيه، وضع خطة صغيرة لتحسينه هذا الأسبوع." },
{ c:"iman", src:"q", ref:"البخاري (50) ومسلم (9)", n:"أبو هريرة", ttl:"معنى الإحسان",
  text:"«الإحسان أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك»",
  sharh:"هذا جزء من حديث جبريل المشهور. الإحسان أعلى درجات الدين: أن تعبد الله وأنت مستحضر أنه يراك، فتتقن عبادتك وتخشع فيها.",
  f:["مراقبة الله تُصلح العمل كله.","للدين مراتب: الإسلام ثم الإيمان ثم الإحسان.","الإتقان من الإيمان."],
  w:[["الإحسان","الإتقان ومراقبة الله"]],
  amal:"في صلاتك القادمة تذكّر قبل التكبير أن الله يراك، ولاحظ أثر ذلك على خشوعك." },
{ c:"iman", src:"m", ref:"مسلم (35)", n:"أبو هريرة", ttl:"شُعب الإيمان",
  text:"«الإيمان بضع وسبعون شعبة، فأفضلها قول: لا إله إلا الله، وأدناها إماطة الأذى عن الطريق، والحياء شعبة من الإيمان»",
  sharh:"الإيمان ليس شيئًا واحدًا، بل خصال كثيرة: أعلاها التوحيد، وأصغرها إزالة ما يؤذي الناس من الطريق.",
  f:["الإيمان قول وعمل.","حتى الأعمال الصغيرة لها مكان في الإيمان.","الحياء خُلق إيماني."],
  w:[["بضع","من ثلاثة إلى تسعة"],["شعبة","جزء وخصلة"],["إماطة","إزالة"]],
  amal:"أزل اليوم شيئًا يؤذي الناس من طريق أو ممر، ولو حجرًا صغيرًا." },
{ c:"iman", src:"q", ref:"البخاري (13) ومسلم (45)", n:"أنس بن مالك", ttl:"حب الخير للآخرين",
  text:"«لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»",
  sharh:"لا يكمل إيمان المسلم حتى يتمنى لأخيه من الخير مثل ما يتمناه لنفسه، فلا يحسده ولا يغشّه.",
  f:["سلامة القلب من الحسد من كمال الإيمان.","المجتمع المسلم قائم على المحبة.","نفي الإيمان هنا نفي لكماله لا لأصله."],
  w:[["لا يؤمن","لا يكمل إيمانه"]],
  amal:"ادعُ اليوم لثلاثة أشخاص بالخير الذي تتمناه لنفسك." },
{ c:"iman", src:"m", ref:"مسلم (2564)", n:"أبو هريرة", ttl:"الله ينظر إلى القلوب",

const KEY = "riyad-sahihain-v1";

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const ar = (n) => Number(n).toLocaleString("ar-EG");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const strip = (s) => s.replace(/[ً-ْٰ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
const BOTH = ["عبد الله بن عمر", "عبد الله بن عمرو", "عبد الله بن عباس", "النعمان بن بشير", "معاوية بن أبي سفيان"];
const taradi = (n) => n === "عائشة" ? "عنها" : BOTH.includes(n) ? "عنهما" : "عنه";
const catOf = (id) => CATS.find((c) => c.id === id);
const learnedCount = () => H.filter((h) => S.learned[h.id]).length;
const app = document.getElementById("app");
let listCat = "all", listQuery = "", hifzLevel = 0;

function matnHTML(t) {
  // تلوين كلام النبي ﷺ الوارد بين «»
  return esc(t).replace(/«([^»]*)»/g, '<span class="q">«$1»</span>');
}
// رابط البحث عن الحديث في موسوعة الدرر السنية للتحقق من صحته ولفظه
function dorarURL(h) {
  const base = quoted(h.text).split(/\s+/).length >= 4 ? quoted(h.text) : h.text;
  const t = base.replace(/[ً-ْٰ«»،:؟.]/g, "").split(/\s+/).filter(Boolean).slice(0, 7).join(" ");
  return "https://dorar.net/hadith/search?q=" + encodeURIComponent(t);
}
function srcBadge(h) { const [l, c] = SRC[h.src]; return `<span class="badge ${c}">${l}</span>`; }

}

function viewList() {
  const q = strip(listQuery.trim());
  let items = H.filter((h) => listCat === "all" || (listCat === "fav" ? S.fav[h.id] : h.c === listCat));
  if (q) items = items.filter((h) => strip(h.text + " " + h.ttl + " " + h.n).includes(q));
  const chips = [["all", "الكل"], ["fav", "المفضلة"], ...CATS.map((c) => [c.id, c.t])];
  return `
  <input class="search" id="q" type="search" placeholder="ابحث في الأحاديث: الصدق، الجار، الصلاة…" value="${esc(listQuery)}" aria-label="بحث">
  <div class="chips" role="tablist">${chips.map(([id, t]) => `<button class="chip ${listCat === id ? "on" : ""}" data-filter="${id}" type="button">${t}</button>`).join("")}</div>
  <div class="list">${items.length ? items.map((h) => `
    <a class="item" href="#h-${h.id}" style="text-decoration:none;color:inherit">
      <span class="n ${S.learned[h.id] ? "done" : ""}">${S.learned[h.id] ? "✓" : ar(h.id)}</span>
      <span class="body">
        <span class="row"><span class="ttl">${esc(h.ttl)}</span>${srcBadge(h)}${S.fav[h.id] ? '<span class="badge b-q">★</span>' : ""}</span>
        <span class="ex">${esc(h.text)}</span>
      </span>
    </a>`).join("") : `<div class="empty">${listCat === "fav" ? "لم تضف أحاديث إلى المفضلة بعد. اضغط ★ في صفحة أي حديث." : "لا توجد نتائج. جرّب كلمة أخرى."}</div>`}</div>`;
}

function viewHadith(h) {
  S.last = h.id; save();
  const prev = H[h.id - 2], next = H[h.id];
  return `
  <div class="row"><button class="chip" data-cat="${h.c}" type="button">← ${catOf(h.c).t}</button></div>
  <article class="folio">
    <div class="folio-top"><span class="num">الحديث ${ar(h.id)} من ${ar(H.length)}</span><span class="spacer"></span>${srcBadge(h)}${S.learned[h.id] ? '<span class="badge b-done">محفوظ</span>' : ""}</div>
    <h2 style="margin-top:8px;position:relative">${esc(h.ttl)}</h2>
    <p class="matn">${matnHTML(h.text)}</p>
    <div class="rawi">الراوي: ${esc(h.n)} رضي الله ${taradi(h.n)} · ${esc(h.ref)}</div>
  </article>

  <div class="row">
    <button class="btn ${S.learned[h.id] ? "on" : ""}" data-act="learn" data-id="${h.id}" type="button">${S.learned[h.id] ? "✓ حفظته" : "علّم: حفظته"}</button>
    <a class="btn primary" href="#hifz-${h.id}">احفظه الآن</a>
    <button class="btn star ${S.fav[h.id] ? "on" : ""}" data-act="fav" data-id="${h.id}" type="button">★ ${S.fav[h.id] ? "في المفضلة" : "مفضلة"}</button>
    <button class="btn" data-act="copy" data-id="${h.id}" type="button">نسخ</button>
  </div>

  <a class="panel verify" href="${dorarURL(h)}" target="_blank" rel="noopener">
    <span class="verify-t">تحقّق من صحة الحديث</span>
    <span class="muted small">افتح الحديث في موسوعة الدرر السنية لترى لفظه في المصادر وحكم العلماء عليه ←</span>
  </a>

  <section class="panel sec">
    <div class="sec-block"><h3>المعنى بإيجاز</h3><p>${esc(h.sharh)}</p></div>
    ${h.w.length ? `<div class="sec-block"><h3>معاني الكلمات</h3><dl class="words">${h.w.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div>` : ""}
    <div class="sec-block"><h3>ماذا نتعلّم؟</h3><ul class="fawaid">${h.f.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="sec-block amal"><h3>طبّقه اليوم</h3><p>${esc(h.amal)}</p></div>
  </section>

  <div class="row">
    ${prev ? `<a class="btn" href="#h-${prev.id}">→ السابق</a>` : ""}
    <span class="spacer"></span>
    ${next ? `<a class="btn" href="#h-${next.id}">التالي ←</a>` : ""}
  </div>`;
}

function hiddenSet(words, level) {
  // 0: الكل ظاهر، 1: إخفاء كل ثالث كلمة، 2: إظهار كل ثالث كلمة فقط، 3: إظهار أول كلمة فقط
  return words.map((w, i) => {
    if (level === 0 || /^[«»:،.؟]+$/.test(w)) return false;
    if (level === 1) return i % 3 === 2;
    if (level === 2) return i % 3 !== 0;
    return i !== 0;
  });
}
function viewHifz(h) {
  S.last = h.id; save();
  const words = h.text.split(/\s+/);
  const hid = hiddenSet(words, hifzLevel);
  const labels = ["اقرأ كاملًا", "إخفاء قليل", "إخفاء أكثر", "من الذاكرة"];
  return `
  <div class="row"><h2>الحفظ</h2><span class="spacer"></span>
    <select class="btn" id="hifzPick" aria-label="اختر الحديث">${H.map((x) => `<option value="${x.id}" ${x.id === h.id ? "selected" : ""}>${ar(x.id)}. ${esc(x.ttl)}</option>`).join("")}</select>
  </div>
  <div class="levels">${labels.map((l, i) => `<button class="chip ${hifzLevel === i ? "on" : ""}" data-level="${i}" type="button">${ar(i + 1)}. ${l}</button>`).join("")}</div>
  <article class="folio">
    <div class="folio-top"><span class="num">${esc(h.ttl)}</span><span class="spacer"></span>${srcBadge(h)}</div>
    <p class="matn" id="hifzText">${words.map((w, i) => `<span class="w ${hid[i] ? "hid" : ""}" data-w="${i}">${esc(w)}</span>`).join(" ")}</p>
    <div class="rawi">الراوي: ${esc(h.n)}</div>
  </article>
  <div class="row">
    <button class="btn" data-act="reveal" type="button">أظهر الكل</button>
    <button class="btn" data-act="rehide" type="button">أعد الإخفاء</button>
    <span class="spacer"></span>
    <button class="btn ${S.learned[h.id] ? "on" : ""}" data-act="learn" data-id="${h.id}" type="button">${S.learned[h.id] ? "✓ حفظته" : "حفظته"}</button>
  </div>
  <section class="panel small">
    <h3>طريقة الحفظ</h3>
    <ol class="steps">
      <li>اقرأ الحديث كاملًا بصوت مسموع ثلاث مرات، وافهم معناه من صفحة الشرح.</li>
      <li>انتقل إلى المستوى التالي وسمّع الكلمات المخفية، واضغط على أي كلمة لكشفها إن نسيتها.</li>
      <li>حين تسمّعه في مستوى «من الذاكرة» دون كشف أي كلمة، علّم عليه «حفظته».</li>
    </ol>
  </section>
  <div class="row">
    ${H[h.id - 2] ? `<a class="btn" href="#hifz-${h.id - 1}">→ السابق</a>` : ""}
    <a class="btn" href="#h-${h.id}">الشرح</a>
    <span class="spacer"></span>
    ${H[h.id] ? `<a class="btn" href="#hifz-${h.id + 1}">التالي ←</a>` : ""}
  </div>`;
}

/* ---------- الاختبار ---------- */
let Q = null;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOthers = (h, fn, k) => shuffle([...new Set(H.filter((x) => x.id !== h.id).map(fn).filter((v) => v !== fn(h)))]).slice(0, k);
function quoted(t) { const m = t.match(/«([^»]+)»/); return m ? m[1] : t; }
function halves(t) { const w = quoted(t).split(/\s+/); const cut = Math.max(2, Math.ceil(w.length / 2)); return [w.slice(0, cut).join(" "), w.slice(cut).join(" ")]; }

function makeQuestion(h) {
  const types = ["complete", "rawi", "src", "meaning"];
  const [a, b] = halves(h.text);
  let type = types[Math.floor(Math.random() * types.length)];
  if (type === "complete" && (!b || b.split(" ").length < 2)) type = "rawi";
  if (type === "complete") {
    const others = shuffle(H.filter((x) => x.id !== h.id)).map((x) => halves(x.text)[1]).filter((x) => x && x !== b).slice(0, 3);
    return { h, label: "أكمل الحديث", prompt: `«${a} …»`, opts: shuffle([b, ...others]), ans: b, txt: true };
  }
  if (type === "rawi") return { h, label: "من راوي هذا الحديث؟", prompt: h.text, opts: shuffle([h.n, ...pickOthers(h, (x) => x.n, 3)]), ans: h.n };
  if (type === "src") {
    const all = ["متفق عليه (البخاري ومسلم)", "رواه البخاري وحده", "رواه مسلم وحده"];
    const ans = { q: all[0], k: all[1], m: all[2] }[h.src];
    return { h, label: "أين ورد هذا الحديث؟", prompt: h.text, opts: all, ans };
  }
  return { h, label: "ما الفكرة الرئيسة لهذا الحديث؟", prompt: h.text, opts: shuffle([h.ttl, ...pickOthers(h, (x) => x.ttl, 3)]), ans: h.ttl };
}
function startQuiz(pool) {
  const src = pool && pool.length >= 4 ? pool : H;
  Q = { items: shuffle(src).slice(0, 10).map(makeQuestion), i: 0, score: 0, picked: null };
}
function viewQuiz() {
  if (!Q) {
    const nL = learnedCount();
    return `
    <section class="panel sec">
      <h2>اختبر نفسك</h2>
      <p class="muted" style="margin:0">عشرة أسئلة متنوعة: أكمل الحديث، ومن الراوي، وأين ورد، وما فكرته. ستظهر لك الإجابة الصحيحة بعد كل سؤال.</p>
      <div class="row">
        <button class="btn primary" data-act="quiz-all" type="button">اختبار من كل الأحاديث</button>
        <button class="btn" data-act="quiz-learned" type="button" ${nL >= 4 ? "" : "disabled"}>من محفوظاتي فقط (${ar(nL)})</button>
      </div>
      ${nL < 4 ? '<p class="muted small" style="margin:0">احفظ أربعة أحاديث على الأقل لتفعيل اختبار المحفوظات.</p>' : ""}
      <p class="muted small" style="margin:0">أفضل نتيجة لك: ${ar(S.best)} من ${ar(10)} · عدد الاختبارات: ${ar(S.quizzes)}</p>
    </section>`;
  }
  if (Q.i >= Q.items.length) {
    const n = Q.items.length;
    const msg = Q.score === n ? "ممتاز! بارك الله فيك." : Q.score >= n * 0.7 ? "أحسنت، استمر في المراجعة." : "لا بأس، راجع الأحاديث التي أخطأت فيها ثم أعد المحاولة.";
    const wrong = Q.items.filter((q) => !q.ok);
    return `
    <section class="panel sec" style="text-align:center">
      <div class="score-big">${ar(Q.score)} / ${ar(n)}</div>
      <p style="margin:0">${msg}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="quiz-again" type="button">اختبار جديد</button><a class="btn" href="#home">الرئيسية</a></div>
    </section>
    ${wrong.length ? `<section class="sec"><h2>راجع هذه الأحاديث</h2><div class="list">${wrong.map((q) => `
      <a class="item" href="#h-${q.h.id}" style="text-decoration:none;color:inherit"><span class="n">${ar(q.h.id)}</span>
      <span class="body"><span class="ttl">${esc(q.h.ttl)}</span><span class="ex">${esc(q.h.text)}</span></span></a>`).join("")}</div></section>` : ""}`;
  }
  const q = Q.items[Q.i], answered = Q.picked !== null;
  return `
  <div class="row"><span class="muted small">السؤال ${ar(Q.i + 1)} من ${ar(Q.items.length)}</span><span class="spacer"></span><span class="muted small">النتيجة: ${ar(Q.score)}</span></div>
  <div class="progress"><i style="width:${(Q.i / Q.items.length) * 100}%"></i></div>
  <section class="folio">
    <div class="qtype" style="position:relative">${q.label}</div>
    <p class="qprompt" style="position:relative">${matnHTML(q.prompt)}</p>
  </section>
  <div class="opts">${q.opts.map((o, i) => {
    let cls = "";
    if (answered) { if (o === q.ans) cls = "right"; else if (i === Q.picked) cls = "wrong"; }
    return `<button class="opt ${q.txt ? "txt" : ""} ${cls}" data-opt="${i}" type="button" ${answered ? "disabled" : ""}>${esc(o)}</button>`;
  }).join("")}</div>
  ${answered ? `<div class="row"><a class="btn" href="#h-${q.h.id}">اقرأ الشرح</a><a class="btn" href="${dorarURL(q.h)}" target="_blank" rel="noopener">الدرر السنية</a><span class="spacer"></span>
    <button class="btn primary" data-act="quiz-next" type="button">${Q.i + 1 < Q.items.length ? "السؤال التالي" : "عرض النتيجة"}</button></div>` : ""}`;
}

/* ---------- التوجيه ---------- */
function route() {
  const hsh = location.hash.slice(1) || "home";
  let html, tab = "home", m;
  if ((m = hsh.match(/^h-(\d+)$/)) && H[m[1] - 1]) { html = viewHadith(H[m[1] - 1]); tab = "list"; }
  else if ((m = hsh.match(/^hifz-(\d+)$/)) && H[m[1] - 1]) { html = viewHifz(H[m[1] - 1]); tab = "hifz"; }
  else if (hsh === "hifz") { html = viewHifz(H[(S.last || 1) - 1]); tab = "hifz"; }
  else if (hsh === "list") { html = viewList(); tab = "list"; }
  else if (hsh === "quiz") { html = viewQuiz(); tab = "quiz"; }
  else html = viewHome();
  app.innerHTML = html;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.go === tab));
}
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-cat],[data-filter],[data-act],[data-level],[data-opt],[data-w]");
  if (!el) return;
  const d = el.dataset;
  if (d.go) { if (d.go === "quiz" && Q && Q.i >= Q.items.length) Q = null; go(d.go === "hifz" ? "hifz-" + (S.last || 1) : d.go); return; }
  if (d.cat) { listCat = d.cat; listQuery = ""; go("list"); return; }
  if (d.filter) { listCat = d.filter; route(); return; }
  if (d.level) { hifzLevel = +d.level; route(); return; }
  if (d.w !== undefined) { if (el.classList.contains("hid")) { el.classList.remove("hid"); el.classList.add("rev"); } return; }
  if (d.opt !== undefined) {
    if (Q.picked !== null) return;
    const q = Q.items[Q.i]; Q.picked = +d.opt; q.ok = q.opts[Q.picked] === q.ans; if (q.ok) Q.score++;
    route(); return;
  }
  const id = +d.id;
  switch (d.act) {
    case "learn": S.learned[id] = !S.learned[id]; if (!S.learned[id]) delete S.learned[id]; save(); toast(S.learned[id] ? "بارك الله فيك! أُضيف إلى محفوظاتك" : "أُزيل من المحفوظات"); route(); break;
    case "fav": S.fav[id] = !S.fav[id]; if (!S.fav[id]) delete S.fav[id]; save(); toast(S.fav[id] ? "أُضيف إلى المفضلة" : "أُزيل من المفضلة"); route(); break;
    case "copy": {
      const h = H[id - 1]; const txt = `${h.text}\nالراوي: ${h.n} · ${SRC[h.src][0]} · ${h.ref}`;
      const done = () => toast("نُسخ الحديث");
      try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); } catch (err) { fallbackCopy(txt, done); }
      break;
    }
    case "reveal": document.querySelectorAll("#hifzText .w.hid").forEach((w) => { w.classList.remove("hid"); w.classList.add("rev"); }); break;
    case "rehide": route(); break;
    case "quiz-all": startQuiz(); route(); break;
    case "quiz-learned": startQuiz(H.filter((h) => S.learned[h.id])); route(); break;
    case "quiz-again": Q = null; route(); break;
    case "quiz-next":
      Q.i++; Q.picked = null;
      if (Q.i >= Q.items.length) { S.quizzes++; S.best = Math.max(S.best, Q.score); save(); }
      route(); window.scrollTo(0, 0); break;
  }
});
function fallbackCopy(txt, done) {
  const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("تعذّر النسخ، حدّد النص يدويًا"); }
  ta.remove();
}
document.addEventListener("input", (e) => {
  if (e.target.id === "q") {
    listQuery = e.target.value; const pos = e.target.selectionStart; route();
    const inp = document.getElementById("q"); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) {}
  }
});
document.addEventListener("change", (e) => { if (e.target.id === "hifzPick") go("hifz-" + e.target.value); });

/* ---------- الوضع الليلي ---------- */
const root = document.documentElement;
root.lang = "ar"; root.dir = "rtl";
try { const t = localStorage.getItem(KEY + "-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem(KEY + "-theme", root.dataset.theme); } catch (e) {}
});

/* داخل المشروع (GitHub Pages): رابط لتطبيق القرآن وتفعيل العمل دون إنترنت */
if (/github\.io$|^localhost$|^127\./.test(location.hostname)) {
  document.getElementById("quranLink").hidden = false;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}

route();
</script>
