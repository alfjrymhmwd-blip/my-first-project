<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أكاديمية الباريستا">
<title>أكاديمية الباريستا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d5c4b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column mobile app, sticky header, fixed bottom tab bar; a dark "scale display" panel is the recurring signature. */
:root {
  --bg: #eceee9;          /* stone, slightly green */
  --surface: #ffffff;
  --surface-2: #f4f5f1;
  --ink: #231a14;         /* espresso */
  --muted: #6a645d;
  --line: #dadcd5;
  --leaf: #1d5c4b;        /* coffee-leaf green: actions */
  --leaf-soft: #dbe9e3;
  --crema: #b8741f;       /* crema amber: numbers & highlights */
  --crema-soft: #f6e7d2;
  --scale-bg: #1e1915;    /* the scale display */
  --scale-ink: #f3c27a;
  --scale-dim: #8d7b66;
  --ok: #2c7a4b;
  --bad: #b3412e;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120f; --surface: #1f1a16; --surface-2: #29221d; --ink: #efe7de; --muted: #a89d91; --line: #3a312a;
    --leaf: #6cc0a4; --leaf-soft: #1f3a32; --crema: #e6a552; --crema-soft: #3a2b18;
    --scale-bg: #0c0a08; --scale-ink: #f3c27a; --scale-dim: #7b6a57; --ok: #6cc08a; --bad: #e57b66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15120f; --surface: #1f1a16; --surface-2: #29221d; --ink: #efe7de; --muted: #a89d91; --line: #3a312a;
  --leaf: #6cc0a4; --leaf-soft: #1f3a32; --crema: #e6a552; --crema-soft: #3a2b18;
  --scale-bg: #0c0a08; --scale-ink: #f3c27a; --scale-dim: #7b6a57; --ok: #6cc08a; --bad: #e57b66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.35; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

.app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.brand small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.3; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; }

.view { display: grid; gap: 18px; padding-top: 6px; }
.eyebrow { font-size: .78rem; letter-spacing: .04em; color: var(--crema); font-weight: 600; }
.lead { color: var(--muted); max-width: 60ch; }

/* Scale display */
.scale { background: var(--scale-bg); color: var(--scale-ink); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
.scale-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.readout { background: rgba(255,255,255,.035); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.readout label { display: block; font-size: .78rem; color: var(--scale-dim); font-family: var(--font-body); }
.readout .val { display: flex; align-items: baseline; gap: 6px; direction: ltr; justify-content: flex-end; }
.readout input { width: 100%; min-width: 0; background: transparent; border: 0; color: var(--scale-ink); font-family: var(--font-num); font-size: 2rem; font-weight: 600; text-align: right; padding: 0; font-variant-numeric: tabular-nums; }
.readout input:focus { outline: none; }
.readout:focus-within { box-shadow: 0 0 0 2px var(--scale-ink); }
.readout .unit { color: var(--scale-dim); font-family: var(--font-num); font-size: .95rem; }
.ratio-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ratio-big { font-family: var(--font-num); font-size: 1.5rem; font-weight: 600; direction: ltr; }
.ratio-hint { color: var(--scale-dim); font-size: .85rem; }
input[type=range] { width: 100%; accent-color: var(--scale-ink); direction: ltr; }
.bar { height: 14px; border-radius: 999px; overflow: hidden; display: flex; direction: ltr; background: rgba(255,255,255,.06); }
.bar i { display: block; height: 100%; }
.bar .c { background: #8a5a2b; }
.bar .w { background: #4f86a1; }
.bar-legend { display: flex; justify-content: space-between; font-size: .78rem; color: var(--scale-dim); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; font-size: .9rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.fact span { display: block; font-size: .78rem; color: var(--muted); }
.fact b { font-weight: 600; }
.btn { border: 0; background: var(--leaf); color: var(--surface); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-family: var(--font-display); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
:root[data-theme="dark"] .btn { color: #0f1a16; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0f1a16; } }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 40px; height: 40px; font-size: 1.2rem; }
.stepper output { min-width: 34px; text-align: center; font-family: var(--font-num); }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; }
.note { font-size: .88rem; color: var(--muted); }

/* Learn */
.progress { display: grid; gap: 8px; }
.progress .track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--leaf); border-radius: 999px; transition: width .4s; }
.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.lessons li + li { border-top: 1px solid var(--line); }
.lesson-link { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: right; }
.lesson-link:hover { background: var(--surface-2); }
.lesson-link .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-size: .9rem; background: var(--surface-2); border: 1px solid var(--line); }
.lesson-link.done .n { background: var(--leaf); color: var(--surface); border-color: var(--leaf); }
.lesson-link small { display: block; color: var(--muted); font-size: .82rem; line-height: 1.5; }
.lesson-link .t { font-weight: 600; }
.stage { font-size: .78rem; color: var(--muted); font-weight: 600; padding: 14px 16px 4px; background: var(--surface-2); letter-spacing: .02em; }

.prose { display: grid; gap: 12px; max-width: 64ch; }
.prose ul, .prose ol { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 4px; }
.prose strong { color: var(--ink); }
.key { background: var(--crema-soft); border-radius: 12px; padding: 12px 14px; }
.key b { color: var(--crema); font-family: var(--font-display); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 440px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.quiz { display: grid; gap: 10px; }
.opt { text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.why { font-size: .9rem; color: var(--muted); }
.back { background: none; border: 0; color: var(--leaf); font-weight: 600; padding: 0; justify-self: start; display: inline-flex; gap: 6px; align-items: center; }
.gloss { display: grid; gap: 0; }
.gloss div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.gloss div:last-child { border-bottom: 0; }
.gloss dt { font-weight: 600; }
.gloss dt .num { color: var(--muted); font-size: .8rem; font-weight: 500; margin-inline-start: 6px; font-family: var(--font-body); }
.gloss dd { margin: 0; color: var(--muted); font-size: .92rem; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; }

/* Recipes */
.drinks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.drink { text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; position: relative; }
.drink:hover { border-color: var(--leaf); }
.drink .en { font-size: .78rem; color: var(--muted); direction: ltr; text-align: right; }
.drink .name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.drink .base { font-size: .85rem; color: var(--muted); line-height: 1.5; }
.drink .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: .74rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.lv1 { background: var(--leaf-soft); color: var(--leaf); }
.tag.lv2 { background: var(--crema-soft); color: var(--crema); }
.tag.lv3 { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); }
.fav-mark { position: absolute; top: 10px; left: 12px; color: var(--crema); }
.cup { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; }
.cup svg { width: 92px; height: auto; }
.layers { display: grid; gap: 4px; font-size: .85rem; }
.layers span { display: flex; align-items: center; gap: 8px; }
.layers i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
ol.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-num); font-size: .85rem; }
ul.ings { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.ings li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
ul.ings li:last-child { border-bottom: 0; }
ul.ings li b { font-weight: 600; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Timer */
.clock { text-align: center; display: grid; gap: 6px; }
.clock .time { font-family: var(--font-num); font-size: clamp(3.2rem, 16vw, 5rem); font-weight: 600; line-height: 1; direction: ltr; }
.clock .target { font-size: 1rem; color: var(--scale-dim); }
.clock .target b { color: var(--scale-ink); font-family: var(--font-num); font-size: 1.6rem; }
.clock .now { font-family: var(--font-body); font-size: 1rem; color: #efe3d2; min-height: 3.4em; }
.tprog { height: 6px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; direction: ltr; }
.tprog i { display: block; height: 100%; background: var(--scale-ink); width: 0; transition: width .25s linear; }
.tsteps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tsteps li { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.tsteps li:last-child { border-bottom: 0; }
.tsteps li.past { color: var(--muted); }
.tsteps li.cur { color: var(--leaf); font-weight: 600; }
.tsteps .num { color: var(--muted); }
.tsteps .w { font-family: var(--font-num); color: var(--crema); direction: ltr; }

/* Bottom nav */
.nav { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.nav a { display: grid; place-items: center; align-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: .78rem; font-weight: 500; }
.nav a[aria-current="page"] { color: var(--leaf); }
.nav a svg { width: 24px; height: 24px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--leaf)"/><ellipse cx="32" cy="32" rx="14" ry="19" fill="var(--surface)" transform="rotate(-28 32 32)"/><path d="M24 18 C36 26 28 38 40 46" stroke="var(--leaf)" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>
      <div><b>أكاديمية الباريستا</b><small>من الريشيو حتى الكوب</small></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي" title="الوضع الليلي">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>

<nav class="nav" dir="rtl" aria-label="الأقسام">
  <div class="nav-in">
    <a href="#learn" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l10-4 10 4-10 4z"/><path d="M6 9v5c0 1.7 2.7 3 6 3s6-1.3 6-3V9"/></svg>تعلّم</a>
    <a href="#ratio" data-tab="ratio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="10" width="18" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M9 15h6"/></svg>الريشيو</a>
    <a href="#timer" data-tab="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg>المؤقّت</a>
    <a href="#recipes" data-tab="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4"/></svg>الوصفات</a>
  </div>
</nav>

<script>
"use strict";
document.documentElement.lang = "ar";
document.documentElement.dir = "rtl";

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("barista:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("barista:" + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtT = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const r1 = (n) => Math.round(n * 10) / 10;
// escape, then keep number ranges (2:45–3:15, 92–96°) left-to-right inside Arabic text
const escN = (v) => esc(v).replace(/\d[\d.:]*\s?[–-]\s?\d[\d.:]*°?/g, (m) => `<bdi dir="ltr">${m}</bdi>`);

/* ---------- brew methods (shared by calculator & timer) ---------- */
// w: fraction of total water on the scale at that step ("bloom" = 2.5x coffee weight)
const METHODS = {
  espresso: { name: "إسبريسو", en: "Espresso", ratio: 2, min: 1, max: 3, step: 0.1, dose: 18, kind: "espresso",
    grind: "ناعم جدًا، أنعم من ملح الطعام", temp: "92–94°م", time: "25–32 ثانية",
    note: "الرقم الثاني هنا هو وزن الإسبريسو الخارج في الكوب (Yield)، وليس ماء الخزان.",
    steps: [
      { at: 0, txt: "ركّب الحامل وشغّل الاستخلاص فورًا", w: 0 },
      { at: 6, txt: "تظهر أول القطرات عادةً بين الثانية 5 و8", w: 0.05 },
      { at: 20, txt: "راقب الميزان، اقتربت من الوزن المستهدف", w: 0.75 },
      { at: 28, txt: "أوقف الاستخلاص عند الوزن المستهدف", w: 1 }
    ], end: 32 },
  v60: { name: "V60", en: "Hario V60", ratio: 16, min: 14, max: 18, step: 0.5, dose: 15, kind: "filter",
    grind: "متوسط إلى ناعم قليلًا (مثل ملح الطعام)", temp: "92–96°م", time: "2:45–3:15",
    steps: [
      { at: 0, txt: "التفتّح: صب ببطء حتى يتشبع كل البن، ثم حرّك المخروط بلطف", w: "bloom" },
      { at: 45, txt: "الصبة الثانية: دوائر من المنتصف إلى الخارج", w: 0.6 },
      { at: 75, txt: "الصبة الأخيرة بالهدوء نفسه", w: 1 },
      { at: 105, txt: "لفّ المخروط لفة خفيفة ليستوي سطح البن", w: 1 },
      { at: 120, txt: "انتظر انتهاء التصفية، الهدف قبل 3:15", w: 1 }
    ], end: 180 },
  chemex: { name: "كيمكس", en: "Chemex", ratio: 16, min: 14, max: 17, step: 0.5, dose: 30, kind: "filter",
    grind: "متوسط خشن (مثل الملح الخشن)", temp: "93–96°م", time: "4:00–4:30",
    steps: [
      { at: 0, txt: "التفتّح: صب ضعفي وزن البن تقريبًا وحرّك بلطف", w: "bloom" },

  { id: "milk", stage: "الحليب", title: "تبخير الحليب", sub: "رغوة ناعمة لامعة (Microfoam)",
    body: `

<li><strong>اشطف عصا البخار</strong> ثانيتين لإخراج الماء.</li>
<li>ضع طرف العصا تحت سطح الحليب بقليل، مائلًا قليلًا عن المنتصف.</li>
<li><strong>مرحلة التهوية (Stretching):</strong> افتح البخار بالكامل، وارفع الإبريق ببطء حتى تسمع صوت «تمزق ورق» خفيف. هنا يدخل الهواء ويكبر الحجم.</li>
<li><strong>مرحلة الدوران (Texturing):</strong> أدخل العصا قليلًا ليبدأ الحليب بالدوران كدوامة. الدوامة تكسر الفقاعات الكبيرة وتجعل الرغوة ناعمة.</li>
<li>أغلق البخار عند <span class="num">55–65</span>°م (حين يصعب إمساك الإبريق 3 ثوانٍ). لا تتجاوز 70°م، فالحليب يفقد حلاوته.</li>
<li>امسح العصا فورًا واشطفها، ثم انقر الإبريق على الطاولة وحرّكه دائريًا حتى يلمع كالطلاء.</li>

/* ---------- theme ---------- */

/* ---------- router ---------- */
const main = $("#main");
function route() {
  const h = (location.hash || "").slice(1) || store.get("tab", "learn");
  let tab = h, arg = null;
  const m = h.match(/^(lesson|drink)-(.+)$/);
  if (m) { tab = m[1] === "lesson" ? "learn" : "recipes"; arg = m; }
  if (!["learn", "ratio", "timer", "recipes"].includes(tab)) tab = "learn";
  document.querySelectorAll(".nav a").forEach((a) => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (tab !== "timer") stopTick();
  if (!arg) store.set("tab", tab);
  if (arg && arg[1] === "lesson") renderLesson(arg[2]);
  else if (arg && arg[1] === "drink") renderDrink(arg[2]);
  else ({ learn: renderLearn, ratio: renderRatio, timer: renderTimer, recipes: renderRecipes })[tab]();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
const go = (h) => { if (location.hash === "#" + h) route(); else location.hash = h; };

/* ---------- TIMER ---------- */
let audioCtx = null, wakeLock = null;
function beep(f = 880, d = 0.15) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.start(); o.stop(audioCtx.currentTime + d);
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
}
function stopTick() { cancelAnimationFrame(S.timer.raf); }
function timerDose() {
  const T = S.timer, m = METHODS[T.method];
  if (S.calc.method === T.method) return { coffee: S.calc.coffee, water: S.calc.coffee * S.calc.ratio };
  return { coffee: m.dose, water: m.dose * m.ratio };
}
function stepTarget(st, d) { return st.w === "bloom" ? Math.round(d.coffee * 2.5) : Math.round(d.water * st.w); }

function renderTimer() {
  const T = S.timer;
  const list = Object.entries(METHODS).filter(([, m]) => m.steps);
  if (!METHODS[T.method] || !METHODS[T.method].steps) T.method = "v60";
  main.innerHTML = `<section class="view">
    <div><p class="eyebrow">مؤقّت التحضير الموجَّه</p><h1>اتبع الخطوات بالثانية والغرام</h1>
    <p class="lead">ضع الأداة على الميزان وصفّره، ثم اضغط «ابدأ». نخبرك متى تصب وإلى أي وزن.</p></div>
    <div class="chips" role="group" aria-label="طريقة التحضير">${list.map(([k, m]) => `<button class="chip" data-tm="${k}" aria-pressed="${k === T.method}">${esc(m.name)}</button>`).join("")}</div>
    <div class="scale clock">
      <div class="time" id="tTime">0:00</div>
      <div class="target" id="tTarget"></div>
      <div class="now" id="tNow"></div>
      <div class="tprog"><i id="tProg"></i></div>
    </div>
    <div class="row"><button class="btn" id="tGo">ابدأ</button><button class="btn ghost" id="tReset">إعادة</button>
      <span class="note" id="tDose"></span></div>
    <div class="card"><h3>الخطوات</h3><ol class="tsteps" id="tSteps"></ol>
      <p class="note">لتغيير الكمية استخدم <a href="#ratio">حاسبة الريشيو</a> ثم «ابدأ المؤقّت».</p></div>
  </section>`;
  main.querySelectorAll("[data-tm]").forEach((b) => b.addEventListener("click", () => {
    resetTimer(); T.method = b.dataset.tm; store.set("timerMethod", T.method); renderTimer();
  }));
  $("#tGo").addEventListener("click", toggleTimer);
  $("#tReset").addEventListener("click", () => { resetTimer(); drawTimer(); });
  drawTimer();
  if (T.running) tick();
}
function toggleTimer() {
  const T = S.timer;
  if (T.running) { T.elapsed += (performance.now() - T.start) / 1000; T.running = false; stopTick(); releaseWake(); }
  else { T.start = performance.now(); T.running = true; beep(660, .08); requestWake(); tick(); }
  drawTimer();
}
function resetTimer() { const T = S.timer; T.running = false; T.elapsed = 0; T.lastStep = -1; stopTick(); releaseWake(); }
async function requestWake() { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
function curTime() { const T = S.timer; return T.elapsed + (T.running ? (performance.now() - T.start) / 1000 : 0); }
function tick() { drawTimer(); if (S.timer.running) S.timer.raf = requestAnimationFrame(tick); }
function drawTimer() {
  const T = S.timer, m = METHODS[T.method], d = timerDose();
  if (!$("#tTime")) return;
  const t = curTime();
  let idx = -1; m.steps.forEach((s, i) => { if (t >= s.at) idx = i; });
  if (!T.running && t === 0) idx = -1;
  if (T.running && idx !== T.lastStep) { if (T.lastStep !== -1 || idx > 0) beep(); T.lastStep = idx; }
  const done = t >= m.end;
  if (done && T.running) { T.elapsed = m.end; T.running = false; stopTick(); releaseWake(); beep(990, .3); }
  $("#tTime").textContent = fmtT(Math.min(t, m.end));
  const st = idx >= 0 ? m.steps[idx] : m.steps[0];
  const tgt = stepTarget(st, d);
  const isEsp = m.kind === "espresso";
  $("#tTarget").innerHTML = (isEsp && idx < m.steps.length - 1 && idx >= 0 && st.w < 1) ? `الهدف النهائي <b class="num">${Math.round(d.water)}</b> غ` : `${idx < 0 ? "أول صبة حتى" : (isEsp ? "الهدف" : "الميزان يجب أن يقرأ")} <b class="num">${tgt}</b> غ`;
  $("#tNow").textContent = done ? "انتهى التحضير. تذوّق ودوّن ملاحظتك." : idx < 0 ? "جاهز؟ " + m.steps[0].txt : st.txt;
  $("#tProg").style.width = Math.min(100, (t / m.end) * 100) + "%";
  $("#tGo").textContent = T.running ? "إيقاف مؤقت" : (t > 0 && !done ? "متابعة" : "ابدأ");
  $("#tGo").disabled = done;
  $("#tDose").innerHTML = `<bdi>${esc(m.name)}</bdi> · <span class="num">${r1(d.coffee)}g → ${Math.round(d.water)}g</span>`;
  $("#tSteps").innerHTML = m.steps.map((s, i) => `<li class="${i < idx ? "past" : i === idx ? "cur" : ""}"><span class="num">${fmtT(s.at)}</span><span>${escN(s.txt)}</span><span class="w">${isEsp && s.w < 1 ? "" : stepTarget(s, d) + "g"}</span></li>`).join("") +
    `<li class="${done ? "cur" : ""}"><span class="num">${fmtT(m.end)}</span><span>النهاية</span><span></span></li>`;
}

/* ---------- RECIPES ---------- */
function renderRecipes() {
  main.innerHTML = `<section class="view">
    <div><p class="eyebrow">دليل الوصفات · ${DRINKS.length} مشروبًا</p><h1>وصفة كل مشروب</h1>
    <p class="lead">المقادير بالغرام والمليلتر لكوب واحد، مع ترتيب التحضير ونصيحة من خلف البار.</p></div>
    <input class="search" id="dq" type="search" placeholder="ابحث: لاتيه، Cortado، بارد…" aria-label="ابحث في الوصفات">
    <div class="chips" id="cats" role="group" aria-label="التصنيف">${CATS.map(([k, n]) => `<button class="chip" data-c="${k}" aria-pressed="${k === S.cat}">${n}</button>`).join("")}</div>
    <div class="drinks" id="drinks"></div>
  </section>`;
  $("#dq").value = S.q;
  const draw = () => {
    const q = S.q.trim().toLowerCase();
    const rows = DRINKS.filter((d) => (S.cat === "all" || (S.cat === "fav" ? S.favs[d.id] : d.cat === S.cat)) &&
      (!q || (d.name + " " + d.en + " " + d.base).toLowerCase().includes(q)));
    $("#drinks").innerHTML = rows.length ? rows.map((d) => `<button class="drink" data-d="${d.id}">
      ${S.favs[d.id] ? `<span class="fav-mark" aria-label="مفضلة">★</span>` : ""}
      <span class="en">${esc(d.en)}</span><span class="name">${esc(d.name)}</span><span class="base">${escN(d.base)}</span>
      <span class="meta"><span class="tag lv${d.lv}">${["", "سهل", "متوسط", "متقدم"][d.lv]}</span><span class="tag">${escN(d.cup)}</span></span></button>`).join("")
      : `<p class="empty">${S.cat === "fav" ? "لم تضف مفضلات بعد. افتح أي وصفة واضغط ☆." : "لا توجد وصفة مطابقة."}</p>`;
    $("#drinks").querySelectorAll("[data-d]").forEach((b) => b.addEventListener("click", () => go("drink-" + b.dataset.d)));
  };
  $("#dq").addEventListener("input", (e) => { S.q = e.target.value; draw(); });
  main.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => {
    S.cat = b.dataset.c; main.querySelectorAll("[data-c]").forEach((x) => x.setAttribute("aria-pressed", x === b)); draw();
  }));
  draw();
}

function cupSVG(layers) {
  // glass: trapezoid from y=12 to y=120; fill bottom→top
  const top = 14, bot = 118, H = bot - top;
  let y = bot, defs = "", rects = "";
  layers.forEach(([k, share], i) => {
    const h = H * share; y -= h;
    rects += `<rect x="0" y="${y.toFixed(1)}" width="100" height="${(h + .6).toFixed(1)}" fill="${L[k][1]}"/>`;
  });
  return `<svg viewBox="0 0 100 130" role="img" aria-label="مكونات الكوب">
    <defs><clipPath id="glass"><path d="M14 12 L86 12 L78 120 Q77 124 73 124 L27 124 Q23 124 22 120 Z"/></clipPath></defs>
    <g clip-path="url(#glass)"><rect x="0" y="0" width="100" height="130" fill="var(--surface-2)"/>${rects}</g>
    <path d="M14 12 L86 12 L78 120 Q77 124 73 124 L27 124 Q23 124 22 120 Z" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
}

function renderDrink(id) {
  const d = DRINKS.find((x) => x.id === id);
  if (!d) return go("recipes");
  const seen = new Set(), legend = d.layers.slice().reverse().filter(([k]) => !seen.has(k) && seen.add(k));
  const fav = !!S.favs[d.id];
  main.innerHTML = `<section class="view">
    <button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>كل الوصفات</button>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="min-width:0;flex:1"><p class="eyebrow num" style="direction:ltr;text-align:right">${esc(d.en)}</p><h1>${esc(d.name)}</h1><p class="lead">${esc(d.base)}</p></div>
      <button class="icon-btn" id="fav" aria-pressed="${fav}" aria-label="${fav ? "إزالة من المفضلة" : "إضافة للمفضلة"}" style="color:var(--crema);font-size:1.2rem">${fav ? "★" : "☆"}</button>
    </div>
    <div class="card cup">${cupSVG(d.layers)}<div class="layers">${legend.map(([k]) => `<span><i style="background:${L[k][1]};border:1px solid var(--line)"></i>${L[k][0]}</span>`).join("")}</div></div>
    <div class="facts">
      <div class="fact"><span>الكوب</span><b>${escN(d.cup)}</b></div>
      <div class="fact"><span>النسبة</span><b>${escN(d.ratio)}</b></div>
      <div class="fact"><span>الوقت</span><b>${escN(d.time)}</b></div>
      <div class="fact"><span>المستوى</span><b>${["", "سهل", "متوسط", "متقدم"][d.lv]}</b></div>
    </div>
    <div class="card"><h2>المقادير</h2><ul class="ings">${d.ings.map(([a, b]) => `<li><span>${escN(a)}</span><b>${escN(b)}</b></li>`).join("")}</ul></div>
    <div class="card"><h2>طريقة التحضير</h2><ol class="steps">${d.steps.map((s) => `<li><span>${escN(s)}</span></li>`).join("")}</ol></div>
    <div class="key"><b>نصيحة الباريستا:</b> ${escN(d.tip)}</div>
    ${d.method ? `<div class="row">${METHODS[d.method].steps ? `<button class="btn" id="dTimer">افتح المؤقّت لهذه الطريقة</button>` : ""}<button class="btn ghost" id="dCalc">احسب الكمية بالريشيو</button></div>` : ""}
  </section>`;
  $("#back").addEventListener("click", () => go("recipes"));
  $("#fav").addEventListener("click", () => {
    if (S.favs[d.id]) delete S.favs[d.id]; else S.favs[d.id] = true;
    store.set("favs", S.favs); renderDrink(id);
  });
  const m = d.method && METHODS[d.method];
  if (m) {
    const setCalc = () => { S.calc.method = d.method; S.calc.ratio = m.ratio; S.calc.coffee = m.dose; saveCalc(); };
    if ($("#dTimer")) $("#dTimer").addEventListener("click", () => { setCalc(); S.timer.method = d.method; resetTimer(); go("timer"); });
    $("#dCalc").addEventListener("click", () => { setCalc(); go("ratio"); });
  }
}

route();

try { if ("serviceWorker" in navigator && location.protocol === "https:" && /\/barista\//.test(location.pathname)) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
