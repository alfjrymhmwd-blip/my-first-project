<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رسائل الداء والدواء</title>
<meta name="description" content="كل مرة تفتح التطبيق تصلك رسالة من كتاب «الداء والدواء» لابن القيم مع شرح مبسّط">
<meta name="theme-color" content="#7a2e2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الداء والدواء">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="seal-mini" aria-hidden="true">د</span>
    <div>
      <h1>الداء والدواء</h1>
      <p class="sub">رسائل من ابن القيم إليك</p>
    </div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات">
    <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabs" aria-label="الأقسام">
  <button data-tab="today" class="on">
    <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.8 6.6l8.2 6.2 8.2-6.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    <span>رسالتك</span>
  </button>
  <button data-tab="inbox">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16M4 10h16M4 15h10M4 20h7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    <span>الرسائل</span><b class="badge" id="badge" hidden></b>
  </button>
  <button data-tab="book">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 6.5C10 5 7 4.6 3.5 5v13c3.5-.4 6.5 0 8.5 1.5M12 6.5C14 5 17 4.6 20.5 5v13c-3.5-.4-6.5 0-8.5 1.5M12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    <span>الكتاب</span>
  </button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<script src="data/cards.js"></script>
<script src="app.js"></script>
</body>
</html>
