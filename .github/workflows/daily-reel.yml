name: Daily anime Reel

on:
  schedule:
    # 15:00 UTC = 6:00 PM Riyadh/Makkah time (UTC+3). Change as you like.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: build the video without publishing"
        type: boolean
        default: true
      episode:
        description: "Optional: post a specific file (e.g. 007.mp4)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Build and publish Reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          EPISODE: ${{ inputs.episode }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$EPISODE" ] && args+=(--episode "$EPISODE")
          python3 reels/daily_reel.py "${args[@]}"

      - name: Upload preview (test runs)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: reels/out/*.mp4
          retention-days: 3

      - name: Save progress
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Reels: record posted episode"
          git push
