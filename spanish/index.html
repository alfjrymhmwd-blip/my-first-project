<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vamos Español</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, a lesson path grouped in units; azulejo-tile motif; bottom tab bar */
:root{
  --bg:#f1f4fa; --surface:#ffffff; --ink:#14213d; --muted:#56627f; --line:#dbe2f0;
  --azul:#1f4fd1; --azul-soft:#e3eafd; --sol:#e08e00; --sol-soft:#fdf0d5;
  --ok:#17904c; --ok-soft:#dcf5e6; --bad:#c93838; --bad-soft:#fbe2e2;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#161f36; --ink:#e8edfa; --muted:#9aa6c6; --line:#27324f;
  --azul:#7398ff; --azul-soft:#1e2b52; --sol:#f4b43b; --sol-soft:#3a2e14;
  --ok:#41cf82; --ok-soft:#123824; --bad:#ff7070; --bad-soft:#40191d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#161f36; --ink:#e8edfa; --muted:#9aa6c6; --line:#27324f;
  --azul:#7398ff; --azul-soft:#1e2b52; --sol:#f4b43b; --sol-soft:#3a2e14;
  --ok:#41cf82; --ok-soft:#123824; --bad:#ff7070; --bad-soft:#40191d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;padding-block:16px 130px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.es{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-weight:700}
.tr{color:var(--muted);font-size:.95em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* header */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;direction:ltr;display:flex;align-items:baseline;gap:2px}
.logo b{color:var(--sol);font-size:1.9rem}
.logo span{color:var(--azul)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:10px;background:var(--azul-soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--azul);border-radius:99px;transition:width .5s}
.bar.sol>div{background:var(--sol)}
.rank{display:flex;align-items:center;gap:12px}
.rank .em{font-size:2rem;line-height:1}
/* hero / daily */
.daily{background:var(--azul);color:#fff;border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.daily::after{content:"";position:absolute;inset:0 auto 0 0;width:80px;opacity:.16;
  background:conic-gradient(from 45deg,#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/28px 28px}
.daily>*{position:relative;z-index:1}
.daily .lbl{font-size:.85rem;opacity:.9}
.daily .es{font-size:1.8rem;color:#fff}
.daily .tr{color:#fff;opacity:.9}
/* buttons */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-family:var(--display);font-size:1.08rem;background:var(--azul);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--azul) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--azul) 60%,#000)}
.btn.sol{background:var(--sol);color:#1d1404;box-shadow:0 4px 0 color-mix(in srgb,var(--sol) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.btn.big{font-size:1.25rem;padding:16px}
.speak{border:0;background:rgba(255,255,255,.2);color:inherit;width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.speak svg{width:22px;height:22px}
.speak.blue{background:var(--azul);color:#fff}
.speak.soft{width:40px;height:40px;background:var(--azul-soft);color:var(--azul)}
/* path */
.unit{display:flex;flex-direction:column;gap:10px}
.unit-head{display:flex;align-items:center;gap:10px;padding-top:6px}
.unit-head h2{font-size:1.2rem}
.unit-head .tag{background:var(--sol-soft);color:var(--sol);font-weight:700;font-size:.8rem;border-radius:99px;padding:1px 10px;white-space:nowrap}
.lesson{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.lesson.next{border:2px solid var(--sol);box-shadow:0 4px 0 var(--sol-soft)}
.tile{width:54px;height:54px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;
  background:conic-gradient(from 45deg,var(--azul-soft) 0 25%,var(--surface) 0 50%,var(--azul-soft) 0 75%,var(--surface) 0) 0 0/18px 18px;border:2px solid var(--azul)}
.lesson.done .tile{border-color:var(--ok);background:conic-gradient(from 45deg,var(--ok-soft) 0 25%,var(--surface) 0 50%,var(--ok-soft) 0 75%,var(--surface) 0) 0 0/18px 18px}
.lesson .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lesson .info h3{font-size:1.08rem}
.lesson .bar{height:6px}
.lesson .state{font-size:.8rem;font-weight:700;white-space:nowrap}
.lesson.done .state{color:var(--ok)} .lesson.next .state{color:var(--sol)}
/* session */
.sess-top{display:flex;align-items:center;gap:10px}
.x{border:0;background:none;font-size:1.7rem;line-height:1;color:var(--muted);padding:4px 8px}
.sess-top .bar{flex:1}
.combo{font-weight:800;color:var(--sol);font-family:var(--display);white-space:nowrap;min-width:3ch}
.ask{font-family:var(--display);font-weight:700;font-size:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.card .pic{font-size:3.4rem;line-height:1.1}
.card .es{font-size:2rem;line-height:1.3}
.card .ar{font-size:1.3rem;font-weight:600}
.new-badge{background:var(--sol-soft);color:var(--sol);font-weight:700;font-size:.82rem;border-radius:99px;padding:2px 12px}
.say-row{display:flex;gap:10px;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:460px){.opts.grid2{grid-template-columns:1fr 1fr}}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-size:1.08rem;font-weight:600;text-align:center}
.opt.sel{border-color:var(--azul);background:var(--azul-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.big-listen{width:96px;height:96px;margin:4px auto}
.big-listen svg{width:42px;height:42px}
.explain{background:var(--sol-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.explain h3{font-size:1.1rem;color:var(--sol)}
.explain ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
/* build */
.answer{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;direction:ltr;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center;padding-top:6px}
.word{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.word.used{visibility:hidden}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{padding:12px 8px;font-size:1rem;min-height:56px}
.match .opt.gone{opacity:.0;pointer-events:none;transition:opacity .3s}
/* fixed bars */
.foot,.nav{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-title{font-family:var(--display);font-weight:800;font-size:1.25rem}
.foot.ok .fb-title{color:var(--ok)} .foot.bad .fb-title{color:var(--bad)}
.nav{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border-radius:12px;font-size:.82rem;font-weight:600;color:var(--muted)}
.tab .ti{font-size:1.4rem;line-height:1.3}
.tab.on{color:var(--azul);background:var(--azul-soft)}
/* end */
.end{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding-top:24px}
.end .bigt{font-family:var(--display);font-weight:800;font-size:2.8rem;color:var(--sol);direction:ltr}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center;font-size:.9rem}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
/* listen */
.listen-card{min-height:250px;justify-content:center}
.ctrls{display:flex;gap:14px;justify-content:center;align-items:center}
.ctrl{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ctrl.main{width:78px;height:78px;background:var(--azul);color:#fff;border:0}
.ctrl svg{width:26px;height:26px}
.list-mini{display:flex;flex-direction:column;gap:6px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:start;width:100%}
.mini.cur{border-color:var(--azul);background:var(--azul-soft)}
.mini .es{font-size:1rem}
.mini .l{display:flex;gap:10px;align-items:center;min-width:0}
.sel-box{font:inherit;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
/* dictionary */
.search{font:inherit;width:100%;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.dict-group h3{font-size:1rem;color:var(--muted);margin:6px 0}
.dict-item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dict-item .em{font-size:1.5rem;width:1.8em;text-align:center;flex:none}
.dict-item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.dict-list{display:flex;flex-direction:column;gap:6px}
/* challenge */
.timer{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--azul)}
.timer.low{color:var(--bad)}
.note{font-size:.88rem;color:var(--muted);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@keyframes pop{0%{transform:scale(.95);opacity:.4}100%{transform:none;opacity:1}}
.anim{animation:pop .25s ease-out}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){.anim,.shake{animation:none}.bar>div{transition:none}}
</style>
</head>

const KEY="vamos-progress-v2";

let S={xp:0,day:"",dayXp:0,streak:0,lastActive:"",best:0,items:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rollDay(){if(S.day!==today()){S.day=today();S.dayXp=0}}
rollDay();
function addXp(n){rollDay();S.xp+=n;S.dayXp+=n;const t=today();
  if(S.lastActive!==t){S.streak=S.lastActive===yesterday()?S.streak+1:1;S.lastActive=t}save()}
const GOAL=50;
const str=id=>(S.items[id]||{}).s||0;
const seen=id=>!!S.items[id];
function grade(id,ok){const it=S.items[id]||{s:0};it.s=Math.max(0,Math.min(5,it.s+(ok?1:-1)));S.items[id]=it}
function lessonPct(li){const its=byLesson(li);return Math.round(its.reduce((a,x)=>a+Math.min(3,str(x.id)),0)/(its.length*3)*100)}
const lessonDone=li=>lessonPct(li)>=70;

/* ===== Voice (browser text-to-speech) ===== */
const hasTTS="speechSynthesis" in window;
let esVoice=null,arVoice=null;
function loadVoices(){if(!hasTTS)return;const v=speechSynthesis.getVoices();
  esVoice=["es-MX","es-US","es-419","es-ES"].map(p=>v.find(x=>x.lang.replace("_","-")===p)).find(Boolean)||v.find(x=>/^es/i.test(x.lang))||null;
  arVoice=v.find(x=>/^ar/i.test(x.lang))||null}
if(hasTTS){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function speak(text,{rate=.9,lang="es"}={}){return new Promise(res=>{
  if(!hasTTS){res();return}
  try{const u=new SpeechSynthesisUtterance(text);const vv=lang==="es"?esVoice:arVoice;
    u.lang=vv?vv.lang:(lang==="es"?"es-MX":"ar-SA");if(vv)u.voice=vv;u.rate=rate;
    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;
    setTimeout(fin,Math.max(2500,text.length*190/rate));
    speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){res()}})}
function stopSpeech(){if(hasTTS)try{speechSynthesis.cancel()}catch(e){}}

/* ===== Sound effects and confetti ===== */
let AC=null;
function tone(kind){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const notes=kind==="ok"?[660,880]:kind==="win"?[523,659,784,1046]:[300,220];
  notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;
  const s=t+i*.11;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);
  o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.22)})}catch(e){}}
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){if(reduceMotion)return;const c=document.getElementById("fx"),x=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;const cols=["#1f4fd1","#e08e00","#17904c","#c93838","#7398ff"];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.3,s:5+Math.random()*6,c:cols[Math.random()*5|0]}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++n<160)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

  navEl.innerHTML=`<div class="nav-in">${T.map(t=>`<button class="tab ${tab===t[0]?"on":""}" data-tab="${t[0]}"><span class="ti">${t[1]}</span>${t[2]}</button>`).join("")}</div>`;navEl.hidden=false;hideFoot()}
function hideNav(){if(navEl)navEl.hidden=true}
function reset(){listenRun++;stopSpeech();clearInterval(timerId);hideFoot();window.scrollTo(0,0)}
function go(t,arg){reset();tab=t;if(t==="learn")home();else if(t==="listen")listenMode(arg??nextLesson());else if(t==="game")gameIntro();else if(t==="dict")dict()}
function nextLesson(){const i=LESSONS.findIndex((_,k)=>!lessonDone(k));return i<0?0:i}
app.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;const l=+b.dataset.l;
  ({lesson:()=>startSession(l),review:()=>startSession(-1),home:()=>go("learn"),listen:()=>go("listen",l),game:()=>go("game"),gamestart:()=>gameStart()})[b.dataset.go]?.()});

/* ===== Lesson session ===== */
let SS=null;
const wordsOf=s=>s.replace(/[¿?¡!.,]/g,"").split(/\s+/).filter(Boolean);
function startSession(li){
  reset();hideNav();
  let pool;
  if(li<0)pool=shuffle(ALL.filter(x=>seen(x.id))).sort((a,b)=>str(a.id)-str(b.id)).slice(0,6);
  else{const its=byLesson(li),unseen=its.filter(x=>!seen(x.id)),weak=its.filter(x=>seen(x.id)).sort((a,b)=>str(a.id)-str(b.id));
    pool=unseen.slice(0,4).concat(weak).slice(0,5);}
  const fresh=pool.filter(x=>!seen(x.id));
  const steps=[];
  if(li>=0&&fresh.length&&!byLesson(li).some(x=>seen(x.id)))steps.push({t:"explain",li});
  fresh.forEach(it=>steps.push({t:"intro",it}));
  const ex=[];
  pool.forEach(it=>{const types=["meaning","spanish","pic"];if(hasTTS)types.push("listen","listen");if(wordsOf(it.es).length>=2)types.push("build","build");
    shuffle(types).slice(0,2).forEach(t=>ex.push({t,it}))});
  const exs=shuffle(ex).slice(0,10);
  if(pool.length>=4)exs.splice(Math.min(4,exs.length),0,{t:"match",items:shuffle(pool).slice(0,4)});
  SS={li,steps:steps.concat(exs),i:0,total:0,right:0,xp:0,combo:0,best:0,retried:new Set()};
  renderStep();
}
function sessTop(){const pct=Math.min(100,SS.i/SS.steps.length*100);
  return `<div class="sess-top"><button class="x" data-go="home" aria-label="خروج">×</button><div class="bar"><div style="width:${pct}%"></div></div><span class="combo">${SS.combo>=2?"🔥"+SS.combo:""}</span></div>`}
function distract(it,field,n=3){const pick=a=>shuffle(a.filter(x=>x[field]!==it[field]));
  return pick(ALL.filter(x=>x.li===it.li)).concat(pick(ALL.filter(x=>x.li!==it.li))).filter((x,i,a)=>a.findIndex(y=>y[field]===x[field])===i).slice(0,n).map(x=>x[field])}
function renderStep(){
  hideFoot();window.scrollTo(0,0);
  if(SS.i>=SS.steps.length)return endSession();
  const st=SS.steps[SS.i];
  if(st.t==="explain"){const L=LESSONS[st.li];
    app.innerHTML=sessTop()+`<div class="card anim"><div class="pic">${L.e}</div><h2>درس: ${esc(L.t)}</h2><p class="muted">ستتعلّم ${L.w.length} كلمات وعبارات مفيدة.</p></div>
    <div class="explain"><h3>💡 فكرة سريعة قبل أن نبدأ</h3><ul>${L.x.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`;
    setFoot(`<button class="btn sol wide" id="cont">هيا نبدأ!</button>`);$("#cont").onclick=next;return}
  if(st.t==="intro"){const it=st.it;
    app.innerHTML=sessTop()+`<div class="ask">كلمة جديدة: اسمعها وردّدها بصوتك</div>
    <div class="card anim"><span class="new-badge">جديد</span><div class="pic">${it.em}</div><div class="es" lang="es">${esc(it.es)}</div>
    <div class="tr">تُنطق: ${esc(it.tr)}</div><div class="ar">المعنى: ${esc(it.ar)}</div>
    <div class="say-row">${spkBtn(it.es,"blue")}${spkBtn(it.es,"soft",true)}</div></div>`;
    setFoot(`<button class="btn wide" id="cont">حفظتها، التالي</button>`);
    $("#cont").onclick=()=>{S.items[it.id]=S.items[it.id]||{s:1};addXp(2);SS.xp+=2;next()};
    speak(it.es);return}
  if(["meaning","spanish","pic","listen"].includes(st.t)){const it=st.it;
    const field=st.t==="meaning"||st.t==="pic"?"ar":"es",ans=it[field];
    const opts=shuffle([ans].concat(distract(it,field)));
    const q={
      meaning:`<div class="ask">ما معنى هذه الكلمة؟</div><div class="card anim"><div class="es" lang="es">${esc(it.es)}</div><div class="say-row">${spkBtn(it.es)}</div></div>`,
      pic:`<div class="ask">انظر واسمع، ثم اختر المعنى</div><div class="card anim"><div class="pic" style="font-size:4rem">${it.em}</div><div class="es" lang="es" style="font-size:1.5rem">${esc(it.es)}</div></div>`,
      spanish:`<div class="ask">كيف تقولها بالإسبانية؟</div><div class="card anim"><div class="pic">${it.em}</div><div class="ar" style="font-size:1.5rem">${esc(it.ar)}</div></div>`,
      listen:`<div class="ask">اسمع واختر ما سمعته</div><div class="card anim">${spkBtn(it.es,"blue big-listen")}<div class="say-row">${spkBtn(it.es,"soft",true)}<span class="muted">مرة أخرى ببطء</span></div></div>`
    }[st.t];
    app.innerHTML=sessTop()+q+`<div class="opts grid2">${opts.map((o,k)=>`<button class="opt ${field==="es"?"es":""}" data-o="${k}" ${field==="es"?'lang="es"':""}>${esc(o)}</button>`).join("")}</div>`;
    if(st.t!=="spanish")speak(it.es);
    let pick=null;
    setFoot(`<button class="btn wide" id="chk" disabled>تأكّد من إجابتي</button>`);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");pick=opts[+b.dataset.o];$("#chk").disabled=false;if(st.t==="spanish")speak(pick)});
    $("#chk").onclick=()=>{app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=opts[+b.dataset.o];if(v===ans)b.classList.add("right");else if(v===pick)b.classList.add("wrong")});feedback(pick===ans,it)};
    return}
  if(st.t==="build"){const it=st.it,target=wordsOf(it.es);
    const extra=shuffle(ALL.filter(x=>x.id!==it.id).flatMap(x=>wordsOf(x.es)).filter(w=>!target.some(t=>t.toLowerCase()===w.toLowerCase()))).filter((w,i,a)=>a.indexOf(w)===i).slice(0,target.length>3?3:2);
    const bank=shuffle(target.concat(extra)).map((w,k)=>({w,k})),chosen=[];
    app.innerHTML=sessTop()+`<div class="ask">رتّب الكلمات لتكتب الجملة بالإسبانية</div><div class="card anim"><div class="pic">${it.em}</div><div class="ar" style="font-size:1.4rem">${esc(it.ar)}</div></div>
      <div class="answer" id="ans" lang="es"></div><div class="bank" id="bank" lang="es">${bank.map(b=>`<button class="word" data-k="${b.k}">${esc(b.w)}</button>`).join("")}</div>
      <p class="note">اضغط على الكلمات بالترتيب. اضغط على كلمة في الأعلى لإزالتها.</p>`;
    setFoot(`<button class="btn wide" id="chk" disabled>تأكّد من إجابتي</button>`);
    const draw=()=>{$("#ans").innerHTML=chosen.map(k=>`<button class="word" data-a="${k}">${esc(bank[k].w)}</button>`).join("");
      app.querySelectorAll("#bank .word").forEach(b=>b.classList.toggle("used",chosen.includes(+b.dataset.k)));$("#chk").disabled=!chosen.length};
    $("#bank").onclick=e=>{const b=e.target.closest(".word");if(!b||b.disabled)return;const k=+b.dataset.k;if(chosen.includes(k))return;chosen.push(k);speak(bank[k].w,{rate:1});draw()};
    $("#ans").onclick=e=>{const b=e.target.closest(".word");if(!b||b.disabled)return;chosen.splice(chosen.indexOf(+b.dataset.a),1);draw()};
    $("#chk").onclick=()=>{app.querySelectorAll(".word").forEach(b=>b.disabled=true);feedback(chosen.map(k=>bank[k].w).join(" ").toLowerCase()===target.join(" ").toLowerCase(),it)};
    return}
  if(st.t==="match"){const items=st.items,Lc=shuffle(items),Rc=shuffle(items);let a=null,b=null,left=items.length,miss=0;
    app.innerHTML=sessTop()+`<div class="ask">لعبة التوصيل: اضغط على الكلمة ثم على معناها</div><div class="match">
      <div class="col">${Lc.map(x=>`<button class="opt es" lang="es" data-m="${x.id}" data-side="es">${esc(x.es)}</button>`).join("")}</div>
      <div class="col">${Rc.map(x=>`<button class="opt" data-m="${x.id}" data-side="ar">${x.em} ${esc(x.ar)}</button>`).join("")}</div></div>`;
    app.querySelector(".match").onclick=e=>{const btn=e.target.closest(".opt");if(!btn)return;const side=btn.dataset.side;
      app.querySelectorAll(`.opt[data-side="${side}"]`).forEach(x=>x.classList.remove("sel"));btn.classList.add("sel");
      if(side==="es"){a=btn;speak(items.find(x=>x.id===btn.dataset.m).es)}else b=btn;
      if(a&&b){if(a.dataset.m===b.dataset.m){[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("right");setTimeout(()=>x.classList.add("gone"),250)});tone("ok");left--;
          if(!left){SS.total++;SS.right++;const g=miss?6:10;addXp(g);SS.xp+=g;
            setTimeout(()=>{setFoot(`<div class="fb-title">${miss?"أحسنت! 👏":"ممتاز! بدون أي خطأ 🌟"}</div><button class="btn ok wide" id="cont">التالي</button>`,"ok");$("#cont").onclick=next},350)}}
        else{miss++;tone("bad");const pair=[a,b];pair.forEach(x=>x.classList.add("wrong","shake"));setTimeout(()=>pair.forEach(x=>x.classList.remove("wrong","shake","sel")),500)}
        a=b=null}};
    return}
}
function next(){SS.i++;renderStep()}
function feedback(ok,it){
  SS.total++;tone(ok?"ok":"bad");grade(it.id,ok);
  if(ok){SS.right++;SS.combo++;SS.best=Math.max(SS.best,SS.combo);const g=10+(SS.combo>=3?5:0);addXp(g);SS.xp+=g}
  else{SS.combo=0;if(!SS.retried.has(SS.i)){SS.retried.add(SS.steps.length);SS.steps.push(Object.assign({},SS.steps[SS.i]))}}
  save();
  const praise=["أحسنت! 👏","ممتاز! 🌟","¡Muy bien! 💪","رائع! 🎉","¡Perfecto! ✨"][Math.random()*5|0];
  const comboMsg=ok&&SS.combo>=3?`<span class="small">🔥 ${SS.combo} إجابات صحيحة متتالية! نقاط إضافية +5</span>`:"";
  setFoot(`<div class="fb-title">${ok?praise:"ليست هذه، الإجابة الصحيحة:"}</div>${comboMsg}
    <div class="row"><div><div class="es" lang="es" style="font-size:1.2rem">${it.em} ${esc(it.es)}</div><div class="tr">${esc(it.tr)} = ${esc(it.ar)}</div></div>${spkBtn(it.es)}</div>
    ${ok?"":'<span class="small">لا تقلق، سنعيد هذا السؤال بعد قليل.</span>'}
    <button class="btn ${ok?"ok":"bad"} wide" id="cont">التالي</button>`,ok?"ok":"bad");
  $("#cont").onclick=next;
  if(!ok)speak(it.es);
}
function endSession(){
  hideFoot();tone("win");confetti();const acc=SS.total?Math.round(SS.right/SS.total*100):100;
  const nx=SS.li>=0&&lessonDone(SS.li)&&SS.li<LESSONS.length-1?SS.li+1:SS.li;
  const title=acc>=90?"¡Fantástico!":acc>=70?"¡Muy bien!":"¡Bien hecho!";
  app.innerHTML=`<div class="end anim">
    <div class="bigt">${title}</div>
    <h2>${SS.li>=0?(lessonDone(SS.li)?"أتقنت درس ":"أنهيت جلسة من درس ")+esc(LESSONS[SS.li].t):"أنهيت المراجعة"} 🎉</h2>
    <div class="stats3"><div class="stat"><b>+${SS.xp}</b>نقطة</div><div class="stat"><b>${acc}%</b>إجابات صحيحة</div><div class="stat"><b>🔥${curStreak()}</b>أيام متتالية</div></div>
    <div class="panel" style="width:100%"><div class="row small"><span>هدف اليوم 🎯</span><b>${Math.min(S.dayXp,GOAL)} / ${GOAL}</b></div><div class="bar sol"><div style="width:${Math.min(100,S.dayXp/GOAL*100)}%"></div></div>
      ${S.dayXp>=GOAL?'<span class="small">حققت هدف اليوم! أي شيء إضافي هو مكسب لك.</span>':""}</div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%">
      ${SS.li>=0?`<button class="btn sol wide" data-go="lesson" data-l="${nx}">${nx!==SS.li?"الدرس التالي: "+LESSONS[nx].e+" "+esc(LESSONS[nx].t):"جلسة أخرى لتثبيت الكلمات"}</button>`:`<button class="btn sol wide" data-go="review">مراجعة أخرى</button>`}
      <button class="btn ghost wide" data-go="home">العودة للدروس</button></div></div>`;
}

/* ===== Listen mode: hands-free ===== */
function listenMode(li){
  showNav();const its=byLesson(li);let idx=0,playing=false;
  const draw=()=>{const it=its[idx];
    app.innerHTML=`<h1 style="font-size:1.5rem">🎧 تعلّم وأنت مرتاح</h1>
    <p class="muted">شغّل واسترخِ. ستسمع كل كلمة مرتين (عادي ثم ببطء) ثم معناها. ردّدها بصوتك إن استطعت.</p>
    <select class="sel-box" id="lsel" aria-label="اختر الدرس">${LESSONS.map((L,i)=>`<option value="${i}" ${i===li?"selected":""}>${L.e} ${esc(L.t)}</option>`).join("")}</select>
    <div class="card listen-card anim"><div class="pic">${it.em}</div><div class="es" lang="es">${esc(it.es)}</div><div class="tr">تُنطق: ${esc(it.tr)}</div><div class="ar">${esc(it.ar)}</div>
      <span class="muted small" style="font-variant-numeric:tabular-nums">${idx+1} من ${its.length}</span></div>
    <div class="ctrls"><button class="ctrl" id="nx" aria-label="التالي">${ICON.left}</button>
      <button class="ctrl main" id="pp" aria-label="${playing?"إيقاف":"تشغيل"}">${playing?ICON.pause:ICON.play}</button>
      <button class="ctrl" id="pv" aria-label="السابق">${ICON.right}</button></div>
    <div class="list-mini">${its.map((x,k)=>`<button class="mini ${k===idx?"cur":""}" data-k="${k}"><span class="l"><span>${x.em}</span><span class="es" lang="es">${esc(x.es)}</span></span><span class="muted small">${esc(x.ar)}</span></button>`).join("")}</div>
    ${hasTTS?"":'<p class="note">متصفحك لا يدعم الصوت، جرّب Chrome أو Safari.</p>'}`;
    $("#pp").onclick=()=>{playing=!playing;if(playing)loop();else{listenRun++;stopSpeech()}draw()};
    $("#nx").onclick=()=>jump(idx+1);$("#pv").onclick=()=>jump(idx-1);
    $("#lsel").onchange=e=>{reset();listenMode(+e.target.value)};
    app.querySelectorAll(".mini").forEach(b=>b.onclick=()=>jump(+b.dataset.k));
  };
  const jump=k=>{idx=(k+its.length)%its.length;listenRun++;stopSpeech();draw();if(playing)loop();else speak(its[idx].es)};
  async function loop(){const me=++listenRun;
    while(playing&&me===listenRun){const it=its[idx];
      await speak(it.es,{rate:.9});if(me!==listenRun)return;await wait(700);if(me!==listenRun)return;
      await speak(it.es,{rate:.55});if(me!==listenRun)return;await wait(600);if(me!==listenRun)return;
      if(arVoice)await speak(it.ar.replace(/[0-9]/g,""),{lang:"ar",rate:1});else await wait(1500);if(me!==listenRun)return;
      await wait(1300);if(me!==listenRun)return;
      if(!seen(it.id))S.items[it.id]={s:0};addXp(1);
      idx=(idx+1)%its.length;draw()}}
  draw();
}

/* ===== 60-second challenge ===== */
function gamePool(){const s=ALL.filter(x=>seen(x.id));return s.length>=8?s:ALL.filter(x=>x.li<3)}
function gameIntro(){showNav();
  app.innerHTML=`<h1 style="font-size:1.5rem">⚡ تحدّي الدقيقة</h1>
  <div class="card anim"><div class="pic">⏱️</div><h2>كم كلمة تعرف في 60 ثانية؟</h2>
    <p class="muted">تظهر كلمة إسبانية، اختر معناها بسرعة من خيارين. كل إجابة صحيحة = نقطة. الخطأ لا يُنقص شيئًا.</p>
    <div class="stat" style="min-width:160px"><b>🏆 ${S.best||0}</b>أفضل نتيجة لك</div></div>
  <button class="btn sol big wide" data-go="gamestart">ابدأ التحدّي!</button>
  <p class="note">${ALL.filter(x=>seen(x.id)).length>=8?"الأسئلة من الكلمات التي تعلّمتها.":"الأسئلة من دروس البداية. تعلّم 8 كلمات لتأتي الأسئلة من كلماتك."}</p>`}
function gameStart(){reset();hideNav();
  const pool=gamePool();let score=0,left=60,cur=null,lock=false;
  const q=()=>{cur=pool[Math.random()*pool.length|0];const opts=shuffle([cur.ar,distract(cur,"ar",1)[0]]);lock=false;
    $("#gq").innerHTML=`<div class="pic">${cur.em}</div><div class="es" lang="es">${esc(cur.es)}</div>`;
    $("#go").innerHTML=opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("");speak(cur.es,{rate:1})};
  app.innerHTML=`<div class="sess-top"><button class="x" data-go="game" aria-label="خروج">×</button><span class="timer" id="tm">60</span><span style="flex:1"></span><span class="chip">✓ <b id="sc">0</b></span></div>
    <div class="card anim" id="gq"></div><div class="opts" id="go"></div>`;
  $("#go").onclick=e=>{const b=e.target.closest(".opt");if(!b||lock)return;lock=true;const ok=b.dataset.v===cur.ar;
    b.classList.add(ok?"right":"wrong");tone(ok?"ok":"bad");if(ok){score++;$("#sc").textContent=score}else{app.querySelectorAll("#go .opt").forEach(x=>{if(x.dataset.v===cur.ar)x.classList.add("right")})}
    setTimeout(q,ok?350:900)};
  q();
  timerId=setInterval(()=>{left--;const t=$("#tm");if(t){t.textContent=left;t.classList.toggle("low",left<=10)}
    if(left<=0){clearInterval(timerId);stopSpeech();const rec=score>(S.best||0);if(rec)S.best=score;addXp(score*2);
      tone("win");if(rec||score>=10)confetti();
      app.innerHTML=`<div class="end anim"><div class="bigt">${score}</div><h2>${rec?"رقم قياسي جديد! 🏆":"انتهى الوقت! ⏱️"}</h2>
        <div class="stats3"><div class="stat"><b>${score}</b>صحيحة</div><div class="stat"><b>+${score*2}</b>نقطة</div><div class="stat"><b>🏆${S.best}</b>أفضل نتيجة</div></div>
        <button class="btn sol wide" data-go="gamestart">العب مرة أخرى</button><button class="btn ghost wide" data-go="home">العودة للدروس</button></div>`}},1000);
}

/* ===== Dictionary ===== */
function dict(){showNav();
  app.innerHTML=`<h1 style="font-size:1.5rem">📖 القاموس</h1><p class="muted">كل كلمات وعبارات التطبيق (${ALL.length}). ابحث بالعربي أو بالإسباني، واضغط 🔊 لتسمع.</p>
    <input class="search" id="q" type="search" placeholder="ابحث: شكرًا، agua، أين…" autocomplete="off">
    <div id="dl" style="display:flex;flex-direction:column;gap:12px"></div>`;
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ْ¿?¡!.,]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
  const render=()=>{const v=norm($("#q").value.trim());
    const html=LESSONS.map((L,li)=>{const its=byLesson(li).filter(x=>!v||norm(x.es+" "+x.ar+" "+x.tr).includes(v));if(!its.length)return"";
      return `<div class="dict-group"><h3>${L.e} ${esc(L.t)}</h3><div class="dict-list">${its.map(x=>`<div class="dict-item"><span class="em">${x.em}</span><span class="tx"><span class="es" lang="es">${esc(x.es)}</span><span class="small muted">${esc(x.tr)} · <b style="color:var(--ink)">${esc(x.ar)}</b></span></span>${spkBtn(x.es)}</div>`).join("")}</div></div>`}).join("");
    $("#dl").innerHTML=html||'<p class="note">لا توجد نتيجة. جرّب كلمة أخرى.</p>'};
  $("#q").oninput=render;render();
}

go("learn");
</script>
