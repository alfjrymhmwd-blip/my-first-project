<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vamos Español</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile-first column, like a pocket phrasebook; azulejo-tile motif marks lessons */
:root{
  --bg:#f1f4fa; --surface:#ffffff; --ink:#14213d; --muted:#5b6785; --line:#dbe2f0;
  --azul:#1f4fd1; --azul-soft:#e3eafd; --sol:#e99a0c; --sol-soft:#fdf0d5;
  --ok:#17904c; --ok-soft:#dcf5e6; --bad:#c93838; --bad-soft:#fbe2e2;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#161f36; --ink:#e8edfa; --muted:#9aa6c6; --line:#27324f;
  --azul:#7398ff; --azul-soft:#1e2b52; --sol:#f4b43b; --sol-soft:#3a2e14;
  --ok:#41cf82; --ok-soft:#123824; --bad:#ff7070; --bad-soft:#40191d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#161f36; --ink:#e8edfa; --muted:#9aa6c6; --line:#27324f;
  --azul:#7398ff; --azul-soft:#1e2b52; --sol:#f4b43b; --sol-soft:#3a2e14;
  --ok:#41cf82; --ok-soft:#123824; --bad:#ff7070; --bad-soft:#40191d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.es{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-weight:700}
.tr{color:var(--muted);font-size:.92em}
.muted{color:var(--muted)}
/* header */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;direction:ltr;display:flex;align-items:baseline;gap:2px}
.logo b{color:var(--sol);font-size:1.9rem}
.logo span{color:var(--azul)}
.stats{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--sol)}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.bar{height:10px;background:var(--azul-soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--azul);border-radius:99px;transition:width .5s}
.bar.sol>div{background:var(--sol)}
/* day phrase */
.daily{background:var(--azul);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.daily::after{content:"";position:absolute;inset:0 auto 0 0;width:90px;opacity:.16;
  background:conic-gradient(from 45deg,#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/30px 30px}
.daily .lbl{font-size:.8rem;letter-spacing:.04em;opacity:.85}
.daily .es{font-size:1.9rem;color:#fff}
.daily .tr{color:#fff;opacity:.85}
.daily .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
/* buttons */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-family:var(--display);font-size:1.05rem;background:var(--azul);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--azul) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--azul) 60%,#000)}
.btn.sol{background:var(--sol);color:#1d1404;box-shadow:0 4px 0 color-mix(in srgb,var(--sol) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.speak{border:0;background:rgba(255,255,255,.18);color:inherit;width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.speak svg{width:22px;height:22px}
.speak.blue{background:var(--azul);color:#fff}
.speak.small{width:38px;height:38px;background:var(--azul-soft);color:var(--azul)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn:first-child{grid-column:1/-1}
/* lessons */
.sec-title{display:flex;justify-content:space-between;align-items:baseline}
.sec-title h2{font-size:1.25rem}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.tile{width:52px;height:52px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--azul);
  background:conic-gradient(from 45deg,var(--azul-soft) 0 25%,var(--surface) 0 50%,var(--azul-soft) 0 75%,var(--surface) 0) 0 0/18px 18px;border:2px solid var(--azul)}
.lesson.done .tile{color:var(--sol);border-color:var(--sol);background:conic-gradient(from 45deg,var(--sol-soft) 0 25%,var(--surface) 0 50%,var(--sol-soft) 0 75%,var(--surface) 0) 0 0/18px 18px}
.lesson .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lesson .info h3{font-size:1.08rem}
.lesson .info .es{font-weight:500;font-size:.85rem;color:var(--muted)}
.lesson .bar{height:6px}
/* session */
.sess-top{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--muted);padding:4px 8px}
.sess-top .bar{flex:1}
.prompt-lbl{font-family:var(--display);font-weight:700;font-size:1.2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.card .es{font-size:2rem;line-height:1.3}
.card .ar{font-size:1.25rem;font-weight:600}
.new-badge{background:var(--sol-soft);color:var(--sol);font-weight:700;font-size:.8rem;border-radius:99px;padding:2px 12px}
.say-row{display:flex;gap:10px;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;font-size:1.08rem;font-weight:600;text-align:center}
.opt.es{font-weight:700}
.opt.sel{border-color:var(--azul);background:var(--azul-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.big-listen{width:96px;height:96px;margin:6px auto}
.big-listen svg{width:42px;height:42px}
/* build */
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;direction:ltr;justify-content:flex-start;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center;padding-top:6px}
.word{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.word.used{visibility:hidden}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{padding:12px 8px;font-size:1rem}
.match .opt.gone{opacity:0;pointer-events:none;transition:opacity .3s}
/* feedback bar */
.foot{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.foot-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-title{font-family:var(--display);font-weight:800;font-size:1.2rem}
.foot.ok .fb-title{color:var(--ok)} .foot.bad .fb-title{color:var(--bad)}
/* tip */
.tip{background:var(--sol-soft);border-radius:var(--r);padding:14px 16px;font-size:.95rem}
.tip b{color:var(--sol)}
/* end */
.end{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding-top:30px}
.end .big{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--sol);direction:ltr}
.end-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 20px;min-width:120px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
/* listen mode */
.listen-card{min-height:260px;justify-content:center}
.listen-card .ar{transition:opacity .3s}
.ctrls{display:flex;gap:12px;justify-content:center;align-items:center}
.ctrl{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ctrl.main{width:76px;height:76px;background:var(--azul);color:#fff;border:0}
.ctrl svg{width:26px;height:26px}
.list-mini{display:flex;flex-direction:column;gap:6px}
.mini{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.95rem;text-align:start;width:100%}
.mini.cur{border-color:var(--azul);background:var(--azul-soft)}
.mini .es{font-size:1rem}
.note{font-size:.85rem;color:var(--muted);text-align:center}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.anim{animation:pop .25s ease-out}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){.anim,.shake{animation:none}.bar>div{transition:none}}
@media (min-width:480px){.opts.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body style="margin:0">

<div id="app" dir="rtl" lang="ar"></div>

<script>
/* ---------- content: [Spanish, Arabic pronunciation, Arabic meaning] ---------- */
const LESSONS=[
 {title:"التحيات والتعارف",es:"Saludos",tip:"<b>¿</b> و <b>¡</b> المقلوبتان تُكتبان في بداية السؤال والتعجب: ¿Cómo estás?",items:[
  ["Hola","أولا","مرحبًا"],
  ["Buenos días","بوينوس دِياس","صباح الخير"],
  ["Buenas tardes","بويناس تاردِس","مساء الخير (بعد الظهر)"],
  ["Buenas noches","بويناس نوتشِس","مساء الخير / تصبح على خير"],
  ["¿Cómo estás?","كومو إستاس؟","كيف حالك؟"],
  ["Estoy bien, gracias","إستوي بيين، غراسياس","أنا بخير، شكرًا"],
  ["¿Cómo te llamas?","كومو تي ياماس؟","ما اسمك؟"],
  ["Me llamo Ahmed","مي يامو أحمد","اسمي أحمد"],
  ["Mucho gusto","موتشو غوستو","تشرفت بمعرفتك"],
  ["Hasta luego","أستا لويغو","أراك لاحقًا"],
  ["Adiós","أديوس","مع السلامة"]]},
 {title:"كلمات تنقذك",es:"Palabras clave",tip:"حرف <b>h</b> صامت دائمًا في الإسبانية: Hola تُنطق «أولا».",items:[
  ["Sí","سي","نعم"],
  ["No","نو","لا"],
  ["Por favor","بور فابور","من فضلك"],
  ["Gracias","غراسياس","شكرًا"],
  ["De nada","دي نادا","عفوًا"],
  ["Perdón","بيردون","عذرًا"],
  ["Lo siento","لو سيينتو","أنا آسف"],
  ["No entiendo","نو إنتييندو","لا أفهم"],
  ["¿Hablas inglés?","أبلاس إنغليس؟","هل تتكلم الإنجليزية؟"],
  ["Más despacio, por favor","ماس دِسباسيو، بور فابور","أبطأ من فضلك"]]},
 {title:"الأرقام والأسعار",es:"Los números",tip:"<b>v</b> و <b>b</b> تُنطقان تقريبًا مثل الباء العربية: nueve = «نويبي».",items:[
  ["uno","أونو","واحد 1"],
  ["dos","دوس","اثنان 2"],
  ["tres","تريس","ثلاثة 3"],
  ["cuatro","كواترو","أربعة 4"],
  ["cinco","سينكو","خمسة 5"],
  ["seis","سيس","ستة 6"],
  ["siete","سييتي","سبعة 7"],
  ["ocho","أوتشو","ثمانية 8"],
  ["nueve","نويبي","تسعة 9"],
  ["diez","دييس","عشرة 10"],
  ["¿Cuánto cuesta?","كوانتو كويستا؟","كم سعره؟"]]},
 {title:"في المطعم",es:"En el restaurante",tip:"<b>Quiero</b> (أريد) + اسم الشيء = أسهل طريقة لتطلب أي شيء.",items:[
  ["Una mesa para dos","أونا ميسا بارا دوس","طاولة لشخصين"],
  ["La carta, por favor","لا كارتا، بور فابور","قائمة الطعام من فضلك"],
  ["Quiero agua","كييرو أغوا","أريد ماءً"],
  ["Un café con leche","أون كافيه كون ليتشي","قهوة بالحليب"],
  ["pollo","بويو","دجاج"],
  ["pescado","بيسكادو","سمك"],
  ["pan","بان","خبز"],
  ["Sin cerdo, por favor","سين سيردو، بور فابور","بدون لحم خنزير من فضلك"],
  ["¡Está delicioso!","إستا ديليسيوسو!","إنه لذيذ!"],
  ["La cuenta, por favor","لا كوينتا، بور فابور","الحساب من فضلك"]]},
 {title:"الطريق والسفر",es:"De viaje",tip:"<b>¿Dónde está…?</b> (أين يوجد…؟) تكفيك للسؤال عن أي مكان.",items:[
  ["¿Dónde está el baño?","دوندي إستا إل بانيو؟","أين الحمّام؟"],
  ["¿Dónde está la estación?","دوندي إستا لا إستاسيون؟","أين المحطة؟"],
  ["A la derecha","أ لا ديريتشا","إلى اليمين"],
  ["A la izquierda","أ لا إسكييردا","إلى اليسار"],
  ["Todo recto","تودو ريكتو","إلى الأمام مباشرة"],
  ["Está cerca","إستا سيركا","إنه قريب"],
  ["Está lejos","إستا ليخوس","إنه بعيد"],
  ["Un boleto, por favor","أون بوليتو، بور فابور","تذكرة من فضلك"],
  ["¿A qué hora sale el tren?","أ كي أورا سالي إل ترين؟","متى يغادر القطار؟"],
  ["Estoy perdido","إستوي بيرديدو","أنا تائه"]]},
 {title:"التسوّق",es:"De compras",tip:"حرف <b>j</b> يُنطق مثل الخاء العربية: tarjeta = «تارخيتا».",items:[
  ["¿Cuánto cuesta esto?","كوانتو كويستا إستو؟","كم سعر هذا؟"],
  ["Es muy caro","إس موي كارو","إنه غالٍ جدًا"],
  ["Es barato","إس باراتو","إنه رخيص"],
  ["Quiero comprar esto","كييرو كومبرار إستو","أريد شراء هذا"],
  ["¿Tiene otra talla?","تييني أوترا تايا؟","هل لديك مقاس آخر؟"],
  ["Solo estoy mirando","سولو إستوي ميراندو","أتفرّج فقط"],
  ["¿Puedo pagar con tarjeta?","بويدو باغار كون تارخيتا؟","هل أستطيع الدفع بالبطاقة؟"],
  ["En efectivo","إن إيفيكتيبو","نقدًا (كاش)"]]},
 {title:"العائلة والناس",es:"La familia",tip:"<b>el</b> قبل المذكر و <b>la</b> قبل المؤنث، وكلاهما يعني «الـ».",items:[
  ["la familia","لا فاميليا","العائلة"],
  ["el padre","إل بادري","الأب"],
  ["la madre","لا مادري","الأم"],
  ["el hermano","إل إرمانو","الأخ"],
  ["la hermana","لا إرمانا","الأخت"],
  ["el hijo","إل إيخو","الابن"],
  ["la hija","لا إيخا","الابنة"],
  ["el amigo","إل أميغو","الصديق"],
  ["¿De dónde eres?","دي دوندي إريس؟","من أين أنت؟"],
  ["Soy árabe","سوي أرابي","أنا عربي"]]},
 {title:"أفعال كل يوم",es:"Verbos útiles",tip:"الفعل مع «أنا» ينتهي غالبًا بـ <b>o</b>: hablo، como، vivo. ويمكنك حذف Yo.",items:[
  ["Yo como","يو كومو","أنا آكل"],
  ["Yo bebo agua","يو بيبو أغوا","أنا أشرب ماءً"],
  ["Yo voy","يو بوي","أنا أذهب"],
  ["Tengo hambre","تينغو أمبري","أنا جائع"],
  ["Yo quiero","يو كييرو","أنا أريد"],
  ["Hablo un poco de español","أبلو أون بوكو دي إسبانيول","أتكلم قليلًا من الإسبانية"],
  ["Yo trabajo","يو تراباخو","أنا أعمل"],
  ["Me gusta","مي غوستا","يعجبني"],
  ["Necesito ayuda","نيسيسيتو أيودا","أحتاج مساعدة"]]}
];
const ALL=[];LESSONS.forEach((L,li)=>L.items.forEach((x,i)=>ALL.push({id:li+"-"+i,li,es:x[0],tr:x[1],ar:x[2]})));
const byLesson=li=>ALL.filter(x=>x.li===li);

/* ---------- storage (per-browser, safe) ---------- */
const KEY="vamos-progress-v1";
const today=()=>new Date().toISOString().slice(0,10);
let S={xp:0,day:"",dayXp:0,streak:0,lastActive:"",items:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rollDay(){const t=today();if(S.day!==t){S.day=t;S.dayXp=0}}
rollDay();
function addXp(n){rollDay();S.xp+=n;S.dayXp+=n;const t=today();
  if(S.lastActive!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastActive===y?S.streak+1:1;S.lastActive=t}save()}
const GOAL=50;
const str=id=>(S.items[id]||{}).s||0;
const seen=id=>!!S.items[id];
function grade(id,ok){const it=S.items[id]||{s:0};it.s=Math.max(0,Math.min(5,it.s+(ok?1:-1)));S.items[id]=it}
function lessonPct(li){const its=byLesson(li);return Math.round(its.reduce((a,x)=>a+str(x.id),0)/(its.length*5)*100)}
function curStreak(){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);return (S.lastActive===today()||S.lastActive===y)?S.streak:0}

/* ---------- speech ---------- */
const hasTTS="speechSynthesis" in window;
let esVoice=null,arVoice=null;
function loadVoices(){if(!hasTTS)return;const v=speechSynthesis.getVoices();
  const pref=["es-MX","es-US","es-419","es-ES"];
  esVoice=pref.map(p=>v.find(x=>x.lang.replace("_","-")===p)).find(Boolean)||v.find(x=>/^es/i.test(x.lang))||null;
  arVoice=v.find(x=>/^ar/i.test(x.lang))||null}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,{rate=.9,lang="es"}={}){return new Promise(res=>{
  if(!hasTTS){res();return}
  try{const u=new SpeechSynthesisUtterance(text);u.lang=lang==="es"?(esVoice?esVoice.lang:"es-MX"):(arVoice?arVoice.lang:"ar-SA");
    const vv=lang==="es"?esVoice:arVoice;if(vv)u.voice=vv;u.rate=rate;
    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;
    setTimeout(fin,Math.max(2500,text.length*180/rate));
    speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){res()}})}
function stopSpeech(){if(hasTTS)try{speechSynthesis.cancel()}catch(e){}}

/* ---------- tiny sound effects ---------- */
let AC=null;
function tone(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  (ok?[660,880]:[300,220]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.18,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.18);
  o.connect(g).connect(AC.destination);o.start(t+i*.11);o.stop(t+i*.11+.2)})}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ICON={
 spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
 slow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16c0-4 3-7 7-7s7 3 7 7"/><path d="M3 16h17"/><path d="M18 13l3-2"/><circle cx="11" cy="13" r="2"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
 next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5v14h2V5zM5 5v14l10-7z"/></svg>',
 prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5v14h2V5zM19 5v14L9 12z"/></svg>',
 head:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg>'
};
const spkBtn=(text,cls="small",slow=false)=>`<button class="speak ${cls}" data-say="${esc(text)}" ${slow?'data-slow="1"':""} aria-label="${slow?"استمع ببطء":"استمع"}">${slow?ICON.slow:ICON.spk}</button>`;
let footEl=null;
function setFoot(html,cls=""){if(!footEl){footEl=document.createElement("div");document.body.appendChild(footEl)}
  footEl.className="foot "+cls;footEl.innerHTML=`<div class="foot-in" dir="rtl">${html}</div>`;footEl.hidden=false}
function hideFoot(){if(footEl)footEl.hidden=true}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.stopPropagation();speak(b.dataset.say,{rate:b.dataset.slow?.55:.9})}},true);

/* ---------- home ---------- */
let listenRun=0;
function home(){
  listenRun++;stopSpeech();hideFoot();rollDay();
  const dayIdx=Math.floor(Date.now()/864e5)%ALL.length,d=ALL[dayIdx];
  const nextL=LESSONS.findIndex((_,i)=>lessonPct(i)<60);const nl=nextL<0?0:nextL;
  const seenCount=ALL.filter(x=>seen(x.id)).length;
  const known=ALL.filter(x=>str(x.id)>=3).length;
  app.innerHTML=`
  <div class="top">
    <div class="logo" aria-label="Vamos"><b>¡</b><span>Vamos</span><b>!</b></div>
    <div class="stats"><span class="chip" title="أيام متتالية"><i>●</i>${curStreak()} يوم</span><span class="chip" title="مجموع النقاط">${S.xp} XP</span></div>
  </div>
  <div class="goal"><div class="goal-row"><span>هدف اليوم: ${GOAL} نقطة (حوالي 5 دقائق)</span><b style="font-variant-numeric:tabular-nums">${Math.min(S.dayXp,GOAL)}/${GOAL}</b></div>
    <div class="bar sol"><div style="width:${Math.min(100,S.dayXp/GOAL*100)}%"></div></div>
    <span class="muted" style="font-size:.88rem">تعرف ${known} عبارة من ${ALL.length}</span></div>
  <div class="daily">
    <span class="lbl">عبارة اليوم</span>
    <div class="row"><div><div class="es" lang="es">${esc(d.es)}</div><div class="tr">${esc(d.tr)}</div></div>${spkBtn(d.es,"")}</div>
    <div style="font-weight:600;position:relative;z-index:1">${esc(d.ar)}</div>
  </div>
  <div class="actions">
    <button class="btn sol" data-go="lesson" data-l="${nl}">${seenCount?"تابع التعلّم":"ابدأ أول درس"} · ${esc(LESSONS[nl].title)}</button>
    <button class="btn ghost" data-go="review" ${seenCount<4?"disabled":""}>مراجعة سريعة</button>
    <button class="btn ghost" data-go="listen" data-l="${nl}">${"وضع الاستماع"}</button>
  </div>
  ${hasTTS?"":'<p class="note">متصفحك لا يدعم النطق الصوتي، ستظهر طريقة النطق مكتوبة بالعربية.</p>'}
  <div class="sec-title"><h2>الدروس</h2><span class="muted" style="font-size:.88rem">مواقف من الحياة اليومية</span></div>
  <div class="lessons">${LESSONS.map((L,i)=>{const p=lessonPct(i);return `
    <button class="lesson ${p>=80?"done":""}" data-go="lesson" data-l="${i}">
      <span class="tile">${i+1}</span>
      <span class="info"><h3>${esc(L.title)}</h3><span class="es" lang="es">${esc(L.es)} · ${L.items.length} عبارات</span>
      <span class="bar"><div style="width:${p}%"></div></span></span>
    </button>`}).join("")}</div>
  <p class="note">تقدّمك محفوظ في هذا المتصفح فقط.</p>`;
}
app.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;
  const l=+b.dataset.l;if(b.dataset.go==="lesson")startSession(l);else if(b.dataset.go==="review")startSession(-1);else if(b.dataset.go==="listen")listenMode(l);else if(b.dataset.go==="home")home()});

/* ---------- learning session ---------- */
let SS=null;
function wordsOf(s){return s.replace(/[¿?¡!.,]/g,"").split(/\s+/).filter(Boolean)}
function startSession(li){
  listenRun++;stopSpeech();
  let pool;
  if(li<0){pool=shuffle(ALL.filter(x=>seen(x.id))).sort((a,b)=>str(a.id)-str(b.id)).slice(0,6)}
  else{const its=byLesson(li);const unseen=its.filter(x=>!seen(x.id));const weak=its.filter(x=>seen(x.id)).sort((a,b)=>str(a.id)-str(b.id));
    pool=unseen.slice(0,4).concat(weak).slice(0,5);if(pool.length<5)pool=pool.concat(shuffle(its.filter(x=>!pool.includes(x)))).slice(0,5)}
  const steps=[];
  pool.filter(x=>!seen(x.id)).forEach(it=>steps.push({t:"intro",it}));
  const ex=[];
  pool.forEach(it=>{let types=["mcq_ar","mcq_es"];if(hasTTS)types.push("listen");if(wordsOf(it.es).length>=2)types.push("build","build");
    shuffle(types).slice(0,2).forEach(t=>ex.push({t,it}))});
  let exs=shuffle(ex).slice(0,9);
  if(pool.length>=4)exs.splice(Math.min(4,exs.length),0,{t:"match",items:pool.slice(0,4)});
  SS={li,pool,steps:steps.concat(exs),i:0,total:0,right:0,xp:0,retried:new Set()};
  SS.len=SS.steps.length;
  if(li>=0&&!pool.some(x=>seen(x.id)))SS.tipFirst=true;
  renderStep();
}
function header(){const pct=Math.min(100,SS.i/SS.steps.length*100);
  return `<div class="sess-top"><button class="x" data-go="home" aria-label="خروج">×</button><div class="bar"><div style="width:${pct}%"></div></div></div>`}
function distract(it,field,n=3){const same=ALL.filter(x=>x.li===it.li&&x.id!==it.id&&x[field]!==it[field]);const other=ALL.filter(x=>x.li!==it.li&&x[field]!==it[field]);
  return shuffle(same).concat(shuffle(other)).filter((x,i,a)=>a.findIndex(y=>y[field]===x[field])===i).slice(0,n).map(x=>x[field])}
function renderStep(){
  hideFoot();
  if(SS.i>=SS.steps.length)return endSession();
  const st=SS.steps[SS.i];
  let body="";
  if(st.t==="intro"){const it=st.it;
    body=`${SS.tipFirst&&SS.i===0&&SS.li>=0?`<div class="tip">${LESSONS[SS.li].tip}</div>`:""}
    <div class="prompt-lbl">عبارة جديدة</div>
    <div class="card anim"><span class="new-badge">جديد</span><div class="es" lang="es">${esc(it.es)}</div><div class="tr">النطق: ${esc(it.tr)}</div><div class="ar">${esc(it.ar)}</div>
    <div class="say-row">${spkBtn(it.es,"blue")}${spkBtn(it.es,"small",true)}</div></div>`;
    app.innerHTML=header()+body;
    setFoot(`<button class="btn wide" id="cont">فهمت، التالي</button>`);
    $("#cont").onclick=()=>{S.items[it.id]=S.items[it.id]||{s:1};addXp(2);SS.xp+=2;SS.i++;renderStep()};
    speak(it.es);return}
  if(st.t==="mcq_ar"||st.t==="mcq_es"||st.t==="listen"){const it=st.it;
    const field=st.t==="mcq_ar"?"ar":"es",ans=it[field];
    const opts=shuffle([ans].concat(distract(it,field)));
    let q="";
    if(st.t==="mcq_ar")q=`<div class="prompt-lbl">ما معنى هذه العبارة؟</div><div class="card anim"><div class="es" lang="es">${esc(it.es)}</div><div class="say-row">${spkBtn(it.es,"small")}</div></div>`;
    else if(st.t==="mcq_es")q=`<div class="prompt-lbl">كيف تقول بالإسبانية:</div><div class="card anim"><div class="ar" style="font-size:1.5rem">${esc(it.ar)}</div></div>`;
    else q=`<div class="prompt-lbl">استمع واختر ما سمعته</div><div class="card anim">${spkBtn(it.es,"blue big-listen")}<div class="say-row">${spkBtn(it.es,"small",true)}<span class="muted">ببطء</span></div></div>`;
    app.innerHTML=header()+q+`<div class="opts ${field==="es"?"":""}">${opts.map((o,k)=>`<button class="opt ${field==="es"?"es":""}" data-o="${k}" ${field==="es"?'lang="es"':""}>${esc(o)}</button>`).join("")}</div>`;
    if(st.t!=="mcq_es")speak(it.es);
    let pick=null;
    setFoot(`<button class="btn wide" id="chk" disabled>تحقّق</button>`);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");pick=opts[+b.dataset.o];$("#chk").disabled=false;if(field==="es"&&st.t!=="listen")speak(pick)});
    $("#chk").onclick=()=>{app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=opts[+b.dataset.o];if(v===ans)b.classList.add("right");else if(v===pick)b.classList.add("wrong")});feedback(pick===ans,it)};
    return}
  if(st.t==="build"){const it=st.it;const target=wordsOf(it.es);
    const extra=shuffle(ALL.filter(x=>x.id!==it.id).flatMap(x=>wordsOf(x.es)).filter(w=>!target.some(t=>t.toLowerCase()===w.toLowerCase()))).filter((w,i,a)=>a.indexOf(w)===i).slice(0,target.length>3?3:2);
    const bank=shuffle(target.concat(extra)).map((w,k)=>({w,k}));
    const chosen=[];
    app.innerHTML=header()+`<div class="prompt-lbl">رتّب الكلمات لتكوّن العبارة</div><div class="card anim"><div class="ar" style="font-size:1.4rem">${esc(it.ar)}</div></div>
      <div class="answer" id="ans" lang="es"></div><div class="bank" id="bank" lang="es">${bank.map(b=>`<button class="word" data-k="${b.k}">${esc(b.w)}</button>`).join("")}</div>`;
    setFoot(`<button class="btn wide" id="chk" disabled>تحقّق</button>`);
    const drawAns=()=>{$("#ans").innerHTML=chosen.map(k=>`<button class="word" data-a="${k}">${esc(bank[k].w)}</button>`).join("");
      app.querySelectorAll("#bank .word").forEach(b=>b.classList.toggle("used",chosen.includes(+b.dataset.k)));$("#chk").disabled=!chosen.length};
    $("#bank").onclick=e=>{const b=e.target.closest(".word");if(!b||b.disabled)return;const k=+b.dataset.k;if(chosen.includes(k))return;chosen.push(k);speak(bank[k].w,{rate:1});drawAns()};
    $("#ans").onclick=e=>{const b=e.target.closest(".word");if(!b||b.disabled)return;chosen.splice(chosen.indexOf(+b.dataset.a),1);drawAns()};
    $("#chk").onclick=()=>{const got=chosen.map(k=>bank[k].w).join(" ").toLowerCase();app.querySelectorAll(".word").forEach(b=>b.disabled=true);feedback(got===target.join(" ").toLowerCase(),it)};
    return}
  if(st.t==="match"){const items=st.items;const L=shuffle(items),R=shuffle(items);let a=null,b=null,left=items.length,miss=0;
    app.innerHTML=header()+`<div class="prompt-lbl">صِل كل عبارة بمعناها</div><div class="match"><div class="col">${L.map(x=>`<button class="opt es" lang="es" data-m="${x.id}" data-side="es">${esc(x.es)}</button>`).join("")}</div><div class="col">${R.map(x=>`<button class="opt" data-m="${x.id}" data-side="ar">${esc(x.ar)}</button>`).join("")}</div></div>`;
    hideFoot();
    app.querySelector(".match").onclick=e=>{const btn=e.target.closest(".opt");if(!btn)return;const side=btn.dataset.side;
      app.querySelectorAll(`.opt[data-side="${side}"]`).forEach(x=>x.classList.remove("sel"));btn.classList.add("sel");
      if(side==="es"){a=btn;speak(items.find(x=>x.id===btn.dataset.m).es)}else b=btn;
      if(a&&b){if(a.dataset.m===b.dataset.m){[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("right");setTimeout(()=>x.classList.add("gone"),250)});tone(true);left--;
          if(!left){SS.total++;SS.right++;const g=miss?6:10;addXp(g);SS.xp+=g;setTimeout(()=>{setFoot(`<div class="fb-title">رائع! وصلتَ كل الأزواج</div><button class="btn ok wide" id="cont">متابعة</button>`,"ok");$("#cont").onclick=()=>{SS.i++;renderStep()}},350)}}
        else{miss++;tone(false);[a,b].forEach(x=>{x.classList.add("wrong","shake");setTimeout(()=>x.classList.remove("wrong","shake","sel"),500)})}
        a=b=null}};
    return}
}
function feedback(ok,it){
  SS.total++;tone(ok);grade(it.id,ok);
  if(ok){SS.right++;addXp(10);SS.xp+=10}
  else if(!SS.retried.has(SS.i)){SS.retried.add(SS.steps.length);SS.steps.push(Object.assign({},SS.steps[SS.i]))}
  save();
  const praise=["أحسنت!","ممتاز!","¡Muy bien!","رائع!","¡Perfecto!"][Math.random()*5|0];
  setFoot(`<div class="fb-title">${ok?esc(praise):"الإجابة الصحيحة:"}</div>
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between"><div><div class="es" lang="es" style="font-size:1.2rem">${esc(it.es)}</div><div class="tr">${esc(it.tr)} · ${esc(it.ar)}</div></div>${spkBtn(it.es,"small")}</div>
    ${ok?"":'<span class="muted" style="font-size:.88rem">لا بأس، سنعيدها لك بعد قليل.</span>'}
    <button class="btn ${ok?"ok":"bad"} wide" id="cont">متابعة</button>`,ok?"ok":"bad");
  $("#cont").focus({preventScroll:true});
  $("#cont").onclick=()=>{SS.i++;renderStep()};
  if(!ok)speak(it.es);
}
function endSession(){
  hideFoot();const acc=SS.total?Math.round(SS.right/SS.total*100):100;
  const nextLi=SS.li>=0&&lessonPct(SS.li)>=80&&SS.li<LESSONS.length-1?SS.li+1:SS.li;
  app.innerHTML=`<div class="end anim">
    <div class="big">¡Fantástico!</div>
    <h2>${SS.li>=0?"أنهيت جلسة "+esc(LESSONS[SS.li].title):"أنهيت المراجعة"}</h2>
    <div class="end-stats"><div class="stat"><b>+${SS.xp}</b>نقطة</div><div class="stat"><b>${acc}%</b>دقة</div><div class="stat"><b>${curStreak()}</b>يوم متتالي</div></div>
    <div class="goal" style="width:100%"><div class="goal-row"><span>هدف اليوم</span><b>${Math.min(S.dayXp,GOAL)}/${GOAL}</b></div><div class="bar sol"><div style="width:${Math.min(100,S.dayXp/GOAL*100)}%"></div></div></div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%">
      ${SS.li>=0?`<button class="btn sol wide" data-go="lesson" data-l="${nextLi}">${nextLi!==SS.li?"الدرس التالي: "+esc(LESSONS[nextLi].title):"جلسة أخرى"}</button>`:`<button class="btn sol wide" data-go="review">مراجعة أخرى</button>`}
      <button class="btn ghost wide" data-go="home">الرئيسية</button></div></div>`;
}

/* ---------- hands-free listening mode ---------- */
function listenMode(li){
  stopSpeech();hideFoot();const run=++listenRun;let idx=0,playing=false;const its=byLesson(li);
  const draw=()=>{const it=its[idx];
    app.innerHTML=`<div class="sess-top"><button class="x" data-go="home" aria-label="خروج">×</button><h2 style="font-size:1.15rem;flex:1">وضع الاستماع · ${esc(LESSONS[li].title)}</h2></div>
    <p class="muted" style="margin:0">ضع السماعة واسترخِ. نقول العبارة، ثم ببطء، ثم معناها. كرّرها بصوت عالٍ إن أحببت.</p>
    <div class="card listen-card anim"><div class="es" lang="es">${esc(it.es)}</div><div class="tr">${esc(it.tr)}</div><div class="ar">${esc(it.ar)}</div></div>
    <div class="ctrls"><button class="ctrl" id="nx" aria-label="التالي">${ICON.prev}</button><button class="ctrl main" id="pp" aria-label="${playing?"إيقاف":"تشغيل"}">${playing?ICON.pause:ICON.play}</button><button class="ctrl" id="pv" aria-label="السابق">${ICON.next}</button></div>
    <label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:.92rem"><span>الدرس:</span>
      <select id="lsel" style="font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">${LESSONS.map((L,i)=>`<option value="${i}" ${i===li?"selected":""}>${esc(L.title)}</option>`).join("")}</select></label>
    <div class="list-mini">${its.map((x,k)=>`<button class="mini ${k===idx?"cur":""}" data-k="${k}"><span class="es" lang="es">${esc(x.es)}</span><span class="muted">${esc(x.ar)}</span></button>`).join("")}</div>
    ${hasTTS?"":'<p class="note">النطق الصوتي غير مدعوم في هذا المتصفح.</p>'}`;
    $("#pp").onclick=()=>{playing=!playing;if(playing)loop();else{stopSpeech();listenRun++;draw()}draw()};
    $("#nx").onclick=()=>go(idx+1);$("#pv").onclick=()=>go(idx-1);
    $("#lsel").onchange=e=>listenMode(+e.target.value);
    app.querySelectorAll(".mini").forEach(b=>b.onclick=()=>go(+b.dataset.k));
  };
  const go=k=>{idx=(k+its.length)%its.length;stopSpeech();const was=playing;listenRun++;myRun=listenRun;draw();if(was)loop();else speak(its[idx].es)};
  let myRun=run;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  async function loop(){myRun=++listenRun;const me=myRun;
    while(playing&&me===listenRun){const it=its[idx];
      await speak(it.es,{rate:.9});if(me!==listenRun)return;await wait(700);if(me!==listenRun)return;
      await speak(it.es,{rate:.55});if(me!==listenRun)return;await wait(600);if(me!==listenRun)return;
      if(arVoice){await speak(it.ar,{lang:"ar",rate:1});}else await wait(1400);if(me!==listenRun)return;
      await wait(1200);if(me!==listenRun)return;
      if(!seen(it.id)){S.items[it.id]={s:0}}addXp(1);
      idx=(idx+1)%its.length;draw()}}
  draw();
}

home();
</script>
